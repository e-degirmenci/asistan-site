<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Asistan</title>
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Asistan">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <style>
    :root {
      --bg: #f6f5f1;
      --surface: #ffffff;
      --text: #1b1c1f;
      --muted: #6b6e76;
      --line: #e6e4dd;
      --accent: #3b5bdb;
      --accent-soft: #e8ecfb;
      --danger: #c92a2a;
      --radius: 16px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121316;
        --surface: #1b1d21;
        --text: #ececee;
        --muted: #9a9ca3;
        --line: #2b2e34;
        --accent: #8ea4ff;
        --accent-soft: #232a45;
        --danger: #ff8787;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 48px; }
    [hidden] { display: none !important; }

    /* Üst bar */
    header { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 18px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; }
    .brand img { width: 30px; height: 30px; border-radius: 8px; }
    .icon-btn {
      border: 1px solid var(--line); background: var(--surface); color: var(--muted);
      border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer;
    }

    /* Giriş */
    .login { max-width: 360px; margin: 12vh auto 0; text-align: center; }
    .login img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 12px; }
    .login h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
    .login p { color: var(--muted); margin: 0 0 24px; font-size: 15px; }
    .login form { display: grid; gap: 10px; text-align: left; }
    input {
      width: 100%; font: inherit; padding: 13px 14px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    .btn {
      font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 13px 16px;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { .btn { color: #0f1220; } }
    .btn:disabled { opacity: .6; cursor: default; }
    .error { color: var(--danger); font-size: 14px; min-height: 20px; margin: 4px 0 0; }

    /* Bildirim kutusu */
    .notice {
      display: flex; gap: 12px; align-items: center; justify-content: space-between;
      background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px;
      font-size: 15px;
    }
    .notice .btn { padding: 9px 14px; font-size: 15px; white-space: nowrap; }

    /* Tarih seçici */
    .days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; margin: 0 -2px 4px; scrollbar-width: none; }
    .days::-webkit-scrollbar { display: none; }
    .day {
      flex: 0 0 auto; font: inherit; font-size: 14px; padding: 7px 13px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer;
    }
    .day[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* Özet kartı */
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 20px 8px; }
    .card .meta { color: var(--muted); font-size: 14px; margin-bottom: 4px; }
    .card h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 12px; line-height: 1.3; }
    .md h2 { font-size: 17px; margin: 22px 0 6px; padding-top: 14px; border-top: 1px solid var(--line); }
    .md h2:first-child { border-top: 0; padding-top: 0; margin-top: 4px; }
    .md p { margin: 0 0 12px; }
    .md ul { padding-left: 20px; margin: 0 0 12px; }
    .md li { margin: 6px 0; }
    .md li::marker { color: var(--muted); }
    .md strong { font-weight: 650; }
    .md a { color: var(--accent); }
    .md code { font-size: .9em; background: var(--bg); padding: 1px 5px; border-radius: 5px; }
    .empty { color: var(--muted); text-align: center; padding: 48px 12px; }

    /* Sekmeler */
    .tabs {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-bottom: 16px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    }
    .tab {
      font: inherit; font-size: 15px; font-weight: 600; padding: 10px 8px; border: 0; border-radius: 10px;
      background: transparent; color: var(--muted); cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--text); color: var(--bg); }

    /* Ulaşım */
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .seg button {
      font: inherit; font-size: 15px; font-weight: 600; padding: 11px 8px; border-radius: 12px; cursor: pointer;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
    }
    .seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .conn { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .conn:first-of-type { padding-top: 4px; }
    .conn:last-of-type { border-bottom: 0; }
    .conn-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .conn-top .times { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .conn-top .dur { color: var(--muted); font-size: 14px; }
    .conn-top .in { margin-left: auto; font-size: 14px; font-weight: 650; color: var(--accent); }
    .legs { margin-top: 8px; font-size: 15px; display: grid; gap: 5px; }
    .leg { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .line {
      display: inline-block; min-width: 30px; text-align: center; font-size: 13px; font-weight: 700;
      padding: 2px 6px; border-radius: 6px; color: #fff;
    }
    .line.U2 { background: #c3022d; } .line.U3 { background: #ec6726; }
    .xfer { color: var(--muted); font-size: 13px; padding-left: 2px; }
    .ontime { color: #2f9e44; font-size: 13px; }
    .late { color: var(--danger); font-size: 13px; font-weight: 650; }
    .est { color: var(--muted); font-size: 12px; }
    .walk { color: var(--muted); font-size: 13px; }
    .status h3 { font-size: 15px; margin: 0 0 8px; }
    .status .ok { color: #2f9e44; }
    .status details { margin: 8px 0; }
    .status summary { cursor: pointer; font-weight: 600; }
    .status .msg-body { font-size: 14px; color: var(--muted); margin-top: 6px; }
    .refresh { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 0; }

    /* Hava durumu */
    .wx-now { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .wx-now .big { font-size: 56px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
    .wx-now .icon { font-size: 52px; line-height: 1; }
    .wx-now .desc { font-size: 17px; font-weight: 600; margin-top: 6px; }
    .wx-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .wx-brief { background: var(--accent-soft); border-color: transparent; margin-bottom: 14px; padding-bottom: 16px; }
    .wx-brief h2 { font-size: 18px; margin: 0 0 8px; letter-spacing: -0.01em; }
    .wx-brief p { margin: 0 0 12px; }
    .wx-brief .prep-title { font-size: 14px; font-weight: 650; color: var(--muted); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; }
    .wx-brief ul { list-style: none; padding: 0; margin: 0; }
    .wx-brief li { margin: 6px 0; }
    .wx-h { font-size: 15px; font-weight: 650; margin: 22px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
    .wx-hours { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 0 4px 4px; }
    .wx-hours::-webkit-scrollbar { display: none; }
    .wx-hour {
      flex: 0 0 auto; width: 58px; text-align: center; padding: 10px 4px; border-radius: 12px;
      background: var(--bg); font-size: 14px;
    }
    .wx-hour .t { color: var(--muted); font-size: 13px; }
    .wx-hour .e { font-size: 22px; margin: 4px 0; }
    .wx-hour .r { color: var(--accent); font-size: 12px; min-height: 16px; }
    .wx-days { list-style: none; padding: 0; margin: 0; }
    .wx-days li {
      display: grid; grid-template-columns: 84px 30px 1fr auto; align-items: center; gap: 8px;
      padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px;
    }
    .wx-days li:last-child { border-bottom: 0; }
    .wx-days .r { color: var(--accent); font-size: 13px; }
    .wx-days .mm { font-variant-numeric: tabular-nums; }
    .wx-days .mm span { color: var(--muted); }

    /* Gmail butonu: kaydırırken altta sabit kalır, sayfa sonunda kartın altına oturur */
    .open-mail {
      position: sticky; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 5;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; margin-top: 16px; padding: 15px 16px; border-radius: 14px;
      font: inherit; font-weight: 600; text-decoration: none;
      background: var(--text); color: var(--bg); border: 0; cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
    }
    .open-mail:active { transform: scale(.98); }
    .open-mail svg { width: 22px; height: 22px; flex: 0 0 auto; }
    footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Giriş ekranı -->
    <section id="login" class="login" hidden>
      <img src="icon-192.png" alt="">
      <h1>Asistan</h1>
      <p>Günlük mail özetlerin</p>
      <form id="loginForm">
        <input id="email" type="email" autocomplete="username" placeholder="E-posta" required>
        <input id="password" type="password" autocomplete="current-password" placeholder="Şifre" required>
        <button class="btn" id="loginBtn" type="submit">Giriş yap</button>
        <p class="error" id="loginError" role="alert"></p>
      </form>
    </section>

    <!-- Ana ekran -->
    <section id="app" hidden>
      <header>
        <div class="brand"><img src="icon-192.png" alt="">Asistan</div>
        <button class="icon-btn" id="logout" type="button">Çıkış</button>
      </header>

      <div class="notice" id="notice" hidden>
        <span id="noticeText"></span>
        <button class="btn" id="noticeBtn" type="button" hidden>Aç</button>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" type="button" data-tab="mail" aria-selected="true">📬 Mailler</button>
        <button class="tab" role="tab" type="button" data-tab="hava" aria-selected="false">🌤️ Hava</button>
        <button class="tab" role="tab" type="button" data-tab="ulasim" aria-selected="false">🚇 Ulaşım</button>
      </div>

      <!-- Sekme: E-mailler -->
      <div id="tab-mail" role="tabpanel">
        <nav class="days" id="days" aria-label="Günler"></nav>
        <article class="card" id="card">
          <div class="empty">Yükleniyor…</div>
        </article>
        <a class="open-mail" id="openMail" href="https://mail.google.com/mail/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2.5"></rect>
            <path d="M3.5 6.5 12 13l8.5-6.5"></path>
          </svg>
          Gmail'i aç
        </a>
      </div>

      <!-- Sekme: Hava durumu -->
      <div id="tab-hava" role="tabpanel" hidden>
        <article class="card wx-brief" id="wxBrief" hidden></article>
        <article class="card" id="wx">
          <div class="empty">Yükleniyor…</div>
        </article>
      </div>

      <!-- Sekme: Ulaşım -->
      <div id="tab-ulasim" role="tabpanel" hidden>
        <div class="seg">
          <button type="button" data-route="uni" aria-pressed="true">🏠 → 🎓 Üniye</button>
          <button type="button" data-route="eve" aria-pressed="false">🎓 → 🏠 Eve</button>
        </div>
        <article class="card" id="conns"><div class="empty">Yükleniyor…</div></article>
        <article class="card status" id="transitStatus" style="margin-top:14px" hidden></article>
      </div>

      <footer id="footer"></footer>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.76.1/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@16.4.1/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script>
  (function () {
    const CFG = window.ASISTAN_CONFIG || {};
    const $ = (id) => document.getElementById(id);
    if (!/^https:\/\//.test(CFG.SUPABASE_URL || "") || !CFG.SUPABASE_PUBLISHABLE_KEY || CFG.SUPABASE_PUBLISHABLE_KEY.startsWith("__")) {
      document.querySelector(".wrap").innerHTML = '<p class="empty">config.js henüz doldurulmamış.</p>';
      return;
    }
    const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_PUBLISHABLE_KEY);

    let digests = [];
    let current = null;

    // ---------- Yardımcılar ----------
    const AYLAR = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
    function todayStr(offsetDays = 0) {
      const d = new Date(Date.now() + offsetDays * 86400000);
      return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Berlin" }).format(d);
    }
    function dayLabel(dateStr) {
      if (dateStr === todayStr()) return "Bugün";
      if (dateStr === todayStr(-1)) return "Dün";
      const [, m, d] = dateStr.split("-").map(Number);
      return `${d} ${AYLAR[m - 1]}`;
    }
    function renderMarkdown(md) {
      // Resim/dış içerik yüklenmesin (mail içeriğinden gelen takip pikselleri vb.)
      return DOMPurify.sanitize(marked.parse(md || ""), { USE_PROFILES: { html: true }, FORBID_TAGS: ["img", "style", "form", "input"] });
    }
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

    // ---------- Ekranlar ----------
    function showLogin() {
      $("app").hidden = true;
      $("login").hidden = false;
    }
    async function showApp() {
      $("login").hidden = true;
      $("app").hidden = false;
      if (currentTab === "ulasim") loadTransit();
      await loadDigests();
      await refreshNotice();
    }

    // ---------- Giriş / çıkış ----------
    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("loginError").textContent = "";
      $("loginBtn").disabled = true;
      const { error } = await sb.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value,
      });
      $("loginBtn").disabled = false;
      if (error) {
        $("loginError").textContent = "Giriş yapılamadı: e-posta veya şifre hatalı.";
        return;
      }
      showApp();
    });

    $("logout").addEventListener("click", async () => {
      await sb.auth.signOut();
      showLogin();
    });

    // ---------- Özetler ----------
    async function loadDigests() {
      const { data, error } = await sb
        .from("digests")
        .select("digest_date,title,summary_md,email_count,created_at")
        .order("digest_date", { ascending: false })
        .limit(60);

      if (error) {
        $("card").innerHTML = `<div class="empty">Özetler yüklenemedi.<br><small>${DOMPurify.sanitize(error.message)}</small></div>`;
        return;
      }
      digests = data || [];
      if (!digests.length) {
        $("days").innerHTML = "";
        $("card").innerHTML = '<div class="empty">Henüz özet yok.<br>İlk özet yarın sabah 09:00\'da gelecek.</div>';
        return;
      }
      const wanted = new URLSearchParams(location.search).get("d");
      const pick = digests.find((d) => d.digest_date === wanted) || digests[0];
      renderDays();
      select(pick.digest_date);
    }

    function renderDays() {
      const nav = $("days");
      nav.innerHTML = "";
      for (const d of digests) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "day";
        b.textContent = dayLabel(d.digest_date);
        b.dataset.date = d.digest_date;
        b.addEventListener("click", () => select(d.digest_date));
        nav.appendChild(b);
      }
    }

    function select(date) {
      current = digests.find((d) => d.digest_date === date);
      if (!current) return;
      for (const b of $("days").children) b.setAttribute("aria-pressed", String(b.dataset.date === date));
      $("card").innerHTML = "";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${current.email_count} mail`;
      const h = document.createElement("h1");
      h.textContent = current.title;
      const body = document.createElement("div");
      body.className = "md";
      body.innerHTML = renderMarkdown(current.summary_md);
      $("card").append(meta, h, body);
    }

    // ---------- Bildirimler ----------
    function setNotice(text, buttonText) {
      $("notice").hidden = !text;
      $("noticeText").textContent = text || "";
      $("noticeBtn").hidden = !buttonText;
      if (buttonText) $("noticeBtn").textContent = buttonText;
    }

    function base64ToUint8(b64) {
      const pad = "=".repeat((4 - (b64.length % 4)) % 4);
      const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
      return Uint8Array.from(raw, (c) => c.charCodeAt(0));
    }

    async function saveSubscription(sub) {
      const j = sub.toJSON();
      const { error } = await sb.from("push_subscriptions").upsert({
        endpoint: j.endpoint,
        p256dh: j.keys.p256dh,
        auth: j.keys.auth,
      });
      if (error) throw error;
    }

    async function refreshNotice() {
      if (!pushSupported) {
        if (isIOS && !isStandalone) {
          setNotice("Bildirim için: Safari'de Paylaş → “Ana Ekrana Ekle”, sonra uygulamayı ana ekrandan aç.");
        } else {
          setNotice("");
        }
        return;
      }
      try {
        const reg = await navigator.serviceWorker.register("sw.js");
        const existing = await reg.pushManager.getSubscription();
        if (Notification.permission === "granted" && existing) {
          await saveSubscription(existing); // kayıt güncel kalsın
          setNotice("");
          $("footer").textContent = "🔔 Bildirimler açık · her sabah 09:00";
          return;
        }
        if (Notification.permission === "denied") {
          setNotice("Bildirimler kapalı. Açmak için telefon Ayarları → Bildirimler → Asistan.");
          return;
        }
        setNotice("Her sabah özet hazır olunca bildirim al.", "Bildirimleri aç");
      } catch (err) {
        setNotice("Bildirim ayarlanamadı: " + err.message);
      }
    }

    $("noticeBtn").addEventListener("click", async () => {
      $("noticeBtn").disabled = true;
      try {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          setNotice("Bildirim izni verilmedi.");
          return;
        }
        const reg = await navigator.serviceWorker.ready;
        const sub = (await reg.pushManager.getSubscription()) ||
          (await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: base64ToUint8(CFG.VAPID_PUBLIC_KEY),
          }));
        await saveSubscription(sub);
        setNotice("");
        $("footer").textContent = "🔔 Bildirimler açık · her sabah 09:00";
      } catch (err) {
        setNotice("Bildirim açılamadı: " + err.message);
      } finally {
        $("noticeBtn").disabled = false;
      }
    });

    // ---------- Sekmeler ----------
    let wxLoadedAt = 0;
    let currentTab = "mail";
    function showTab(name) {
      for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-selected", String(b.dataset.tab === name));
      $("tab-mail").hidden = name !== "mail";
      $("tab-hava").hidden = name !== "hava";
      $("tab-ulasim").hidden = name !== "ulasim";
      currentTab = name;
      try { localStorage.setItem("asistan-tab", name); } catch (e) { /* önemli değil */ }
      // Hava durumu: ilk açılışta ve 15 dakikadan eskiyse yenile
      if (name === "hava" && Date.now() - wxLoadedAt > 15 * 60 * 1000) loadWeather();
      if (name === "ulasim") loadTransit();
    }
    for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", () => showTab(b.dataset.tab));

    // ---------- Hava durumu (Münih, Open-Meteo, canlı) ----------
    const WMO = {
      0: ["Açık", "☀️"], 1: ["Çoğunlukla açık", "🌤️"], 2: ["Parçalı bulutlu", "⛅"], 3: ["Kapalı", "☁️"],
      45: ["Sisli", "🌫️"], 48: ["Kırağılı sis", "🌫️"],
      51: ["Hafif çisenti", "🌦️"], 53: ["Çisenti", "🌦️"], 55: ["Yoğun çisenti", "🌧️"],
      56: ["Donan çisenti", "🌧️"], 57: ["Yoğun donan çisenti", "🌧️"],
      61: ["Hafif yağmur", "🌦️"], 63: ["Yağmurlu", "🌧️"], 65: ["Şiddetli yağmur", "🌧️"],
      66: ["Donan yağmur", "🌧️"], 67: ["Şiddetli donan yağmur", "🌧️"],
      71: ["Hafif kar", "🌨️"], 73: ["Karlı", "🌨️"], 75: ["Yoğun kar", "❄️"], 77: ["Kar taneleri", "🌨️"],
      80: ["Hafif sağanak", "🌦️"], 81: ["Sağanak", "🌧️"], 82: ["Şiddetli sağanak", "⛈️"],
      85: ["Kar sağanağı", "🌨️"], 86: ["Yoğun kar sağanağı", "❄️"],
      95: ["Gök gürültülü fırtına", "⛈️"], 96: ["Dolulu fırtına", "⛈️"], 99: ["Şiddetli dolulu fırtına", "⛈️"],
    };
    const SNOW = [71, 73, 75, 77, 85, 86], STORM = [95, 96, 99];
    const GUN = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
    const wmo = (c) => WMO[c] || ["Bilinmiyor", "🌡️"];
    const icon = (c, isDay) => (!isDay && (c === 0 || c === 1)) ? "🌙" : wmo(c)[1];
    const r0 = (x) => Math.round(x);

    async function loadWeather() {
      const params = new URLSearchParams({
        latitude: "48.137", longitude: "11.575", timezone: "Europe/Berlin", forecast_days: "7",
        current: "temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m,is_day",
        hourly: "temperature_2m,apparent_temperature,precipitation_probability,weather_code,is_day",
        daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,wind_speed_10m_max,uv_index_max",
      });
      try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?" + params);
        if (!res.ok) throw new Error("HTTP " + res.status);
        renderWeather(await res.json());
        wxLoadedAt = Date.now();
      } catch (err) {
        $("wx").innerHTML = '<div class="empty">Hava durumu alınamadı.<br><small>İnternet bağlantını kontrol edip sekmeye tekrar dokun.</small></div>';
      }
    }

    // "Bugün/Yarın" kutusu: günün özeti + neye göre hazırlanmalı (kurallara dayalı, anında)
    function buildBrief(w) {
      const c = w.current, d = w.daily, h = w.hourly;
      const nowHr = +c.time.slice(11, 13);
      const di = nowHr >= 20 && d.time.length > 1 ? 1 : 0; // akşam 20'den sonra yarını göster
      const day = d.time[di];
      const lc = (x) => x.toLocaleLowerCase("tr-TR");
      const pad = (n) => String(n).padStart(2, "0");
      const idx = (from, to) => h.time.map((t, i) => [t, i]).filter(([t]) => t.slice(0, 10) === day && +t.slice(11, 13) >= from && +t.slice(11, 13) <= to).map(([, i]) => i);
      const avg = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

      const tmin = r0(d.temperature_2m_min[di]), tmax = r0(d.temperature_2m_max[di]);
      const [desc, emo] = wmo(d.weather_code[di]);

      // Sabah / öğleden sonra / akşam
      const parts = [["Sabah", 7, 11], ["öğleden sonra", 12, 16], ["akşam", 17, 21]].map(([name, a, b]) => {
        const ii = idx(a, b);
        if (!ii.length) return null;
        const code = Math.max(...ii.map((i) => h.weather_code[i]));
        return `${name} ${wmo(code)[1]} ${lc(wmo(code)[0])} (${r0(avg(ii.map((i) => h.temperature_2m[i])))}°)`;
      }).filter(Boolean);

      // Yağış penceresi (08–22)
      const dayIdx = idx(8, 22);
      const rainy = dayIdx.filter((i) => (h.precipitation_probability[i] ?? 0) >= 50).map((i) => +h.time[i].slice(11, 13));
      const codes = new Set([d.weather_code[di], ...dayIdx.map((i) => h.weather_code[i])]);
      const snow = SNOW.some((x) => codes.has(x)), storm = STORM.some((x) => codes.has(x));
      let rainText = "Yağış beklenmiyor.";
      if (rainy.length) {
        const span = rainy[rainy.length - 1] + 1 - rainy[0];
        const kind = snow ? "Kar/yağış" : "Yağış";
        rainText = span >= 12 ? `${kind} gün boyu muhtemel.` : `${kind} ${pad(rainy[0])}:00–${pad(rainy[rainy.length - 1] + 1)}:00 arası bekleniyor.`;
      }
      const sunset = d.sunset[di].slice(11, 16);

      const lead = di === 0 ? "Bugün" : "Yarın";
      const text = `${lead} Münih'te hava ${lc(desc)}, sıcaklık ${tmin}° ile ${tmax}° arasında. ` +
        (parts.length ? parts.join(", ").replace(/^./, (m) => m.toUpperCase()) + ". " : "") +
        `${rainText} Gün batımı ${sunset}.`;

      // Hazırlık önerileri
      const feels = idx(7, 21).map((i) => h.apparent_temperature?.[i] ?? h.temperature_2m[i]);
      const fmin = feels.length ? Math.min(...feels) : tmin;
      const prep = [];
      if (fmin <= 0) prep.push(`🧣 Kalın mont, bere ve eldiven (hissedilen en düşük ${r0(fmin)}°).`);
      else if (fmin <= 8) prep.push(`🧥 Mont giy (hissedilen en düşük ${r0(fmin)}°).`);
      else if (fmin <= 14) prep.push("🧥 Ceket ya da kalın bir sweatshirt yeterli.");
      else if (fmin <= 20) prep.push("👕 Hafif bir ceket al, gerisi rahat.");
      else prep.push("😎 Tişört havası.");
      if (tmax - tmin >= 8) prep.push("🔄 Gün içinde sıcaklık epey değişiyor, kat kat giyin.");
      const windy = (d.wind_speed_10m_max[di] ?? 0) >= 40;
      if (rainy.length && !snow) prep.push(windy ? "🧥 Yağmur ve kuvvetli rüzgar var; şemsiye yerine kapüşonlu/su geçirmez mont daha iyi." : "☂️ Şemsiyeni unutma.");
      else if (windy) prep.push("💨 Kuvvetli rüzgar bekleniyor.");
      if (snow) prep.push("🥾 Kar var: kaymayan, su geçirmez ayakkabı giy.");
      else if (tmin <= 0) prep.push("🧊 Sabah ve akşam buzlanma olabilir, bisiklette dikkat.");
      if (storm) prep.push("⛈️ Gök gürültülü fırtına var, dışarıda uzun kalma.");
      if ((d.uv_index_max?.[di] ?? 0) >= 5) prep.push("🧴 UV yüksek: güneş kremi ve gözlük.");
      if (tmax >= 28) prep.push("💧 Sıcak; yanına su al.");
      if (sunset <= "17:30") prep.push(`🚲 Erken kararıyor (gün batımı ${sunset}); bisikletle döneceksen ışıklarını kontrol et.`);

      return `<h2>${di === 0 ? emo + " Bugün" : "🌙 Yarın"}</h2>
        <p>${text}</p>
        <div class="prep-title">Hazırlık</div>
        <ul>${prep.map((x) => `<li>${x}</li>`).join("")}</ul>`;
    }

    function renderWeather(w) {
      const c = w.current, d = w.daily, h = w.hourly;
      const today = d.time[0];
      const tmin = r0(d.temperature_2m_min[0]), tmax = r0(d.temperature_2m_max[0]);

      // Şu andan itibaren 24 saat
      const nowHour = c.time.slice(0, 13);
      let start = h.time.findIndex((t) => t.slice(0, 13) === nowHour);
      if (start < 0) start = 0;
      const hours = [];
      for (let i = start; i < Math.min(start + 24, h.time.length); i++) hours.push(i);

      $("wxBrief").innerHTML = buildBrief(w);
      $("wxBrief").hidden = false;

      const [desc] = wmo(c.weather_code);
      const hm = (iso) => iso.slice(11, 16);
      let html = `
        <div class="meta">Münih · şimdi</div>
        <div class="wx-now">
          <div>
            <div class="big">${r0(c.temperature_2m)}°</div>
            <div class="desc">${desc}</div>
            <div class="wx-sub">Hissedilen ${r0(c.apparent_temperature)}° · En düşük ${tmin}° · En yüksek ${tmax}°</div>
            <div class="wx-sub">💨 ${r0(c.wind_speed_10m)} km/s · 💧 %${r0(c.relative_humidity_2m)} · 🌅 ${hm(d.sunrise[0])} · 🌇 ${hm(d.sunset[0])}</div>
          </div>
          <div class="icon">${icon(c.weather_code, c.is_day)}</div>
        </div>`;

      html += `<div class="wx-h">Saatlik</div><div class="wx-hours">` + hours.map((i, k) => {
        const p = h.precipitation_probability[i] ?? 0;
        return `<div class="wx-hour">
          <div class="t">${k === 0 ? "Şimdi" : h.time[i].slice(11, 13)}</div>
          <div class="e">${icon(h.weather_code[i], h.is_day[i])}</div>
          <div>${r0(h.temperature_2m[i])}°</div>
          <div class="r">${p >= 20 ? "%" + p : ""}</div>
        </div>`;
      }).join("") + `</div>`;

      html += `<div class="wx-h">7 gün</div><ul class="wx-days">` + d.time.map((t, i) => {
        const day = i === 0 ? "Bugün" : i === 1 ? "Yarın" : GUN[new Date(t + "T12:00:00").getDay()];
        const p = d.precipitation_probability_max[i] ?? 0;
        return `<li>
          <span>${day}</span>
          <span>${wmo(d.weather_code[i])[1]}</span>
          <span class="r">${p >= 20 ? "☔ %" + p : ""}</span>
          <span class="mm"><span>${r0(d.temperature_2m_min[i])}°</span> / ${r0(d.temperature_2m_max[i])}°</span>
        </li>`;
      }).join("") + `</ul>`;

      html += `<div class="wx-sub" style="margin:14px 0 6px">Güncellendi ${new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })} · Kaynak: Open-Meteo</div>`;
      $("wx").innerHTML = html;
    }

    // ---------- Ulaşım (MVG, canlı) ----------
    // Rota: Milbertshofen (U2) → Scheidplatz'ta aktarma → U3 → Universität (ve tersi)
    const TRANSIT = {
      stations: { home: "de:09162:740", transfer: "de:09162:400", uni: "de:09162:70" },
      names: { home: "Milbertshofen", transfer: "Scheidplatz", uni: "Universität" },
      walkMin: { home: 0, uni: 0 },      // evden/binadan durağa yürüme süresi (dakika)
      transferToleranceMin: 1,           // Scheidplatz'ta U2 ve U3 birbirini bekliyor: 1 dk fark bile yetiyor
      lines: ["U2", "U3"],
      routes: {
        uni: {
          from: "home", via: "transfer", to: "uni",
          leg1: { line: "U2", dir: "H", notEndingAt: [] },
          leg2: { line: "U3", dir: "H", notEndingAt: ["Bonner Platz", "Münchner Freiheit"] },
          fallbackMin: [2, 7],           // sefer eşleşmezse tahmini yolculuk süreleri
        },
        eve: {
          from: "uni", via: "transfer", to: "home",
          leg1: { line: "U3", dir: "R", notEndingAt: ["Giselastraße", "Münchner Freiheit", "Bonner Platz"] },
          leg2: { line: "U2", dir: "R", notEndingAt: ["Scheidplatz"] },
          fallbackMin: [7, 2],
        },
      },
    };
    let route = new Date().getHours() < 13 ? "uni" : "eve";
    let transitTimer = null;
    const MIN = 60 * 1000;
    const depT = (d) => d.realtimeDepartureTime ?? d.plannedDepartureTime;
    const dirOf = (d) => (d.lineId || "").split(":")[3] || "";
    const hhmm = (ms) => new Date(ms).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
    const esc = (x) => String(x ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

    function findConnections(r, data, now) {
      const S = TRANSIT.stations;
      const A = data[S[r.from]] || [], B = data[S[r.via]] || [], C = data[S[r.to]] || [];
      const fits = (d, leg) => d.label === leg.line && dirOf(d) === leg.dir && !leg.notEndingAt.includes(d.destination);
      const sameTrip = (list, d) => list.find((x) => x.label === d.label && dirOf(x) === dirOf(d) && x.tripCode === d.tripCode && depT(x) >= depT(d));
      const first = A.filter((d) => fits(d, r.leg1) && depT(d) >= now - 30 * 1000).sort((a, b) => depT(a) - depT(b));
      const second = B.filter((d) => fits(d, r.leg2) && !d.cancelled).sort((a, b) => depT(a) - depT(b));
      const byTrain = new Map();
      for (const d1 of first) {
        if (d1.cancelled) continue;
        const atB = sameTrip(B, d1);
        const arrB = atB ? depT(atB) : depT(d1) + r.fallbackMin[0] * MIN;
        const d2 = second.find((x) => depT(x) >= arrB - TRANSIT.transferToleranceMin * MIN);
        if (!d2) continue;
        const atC = sameTrip(C, d2);
        const arrC = atC ? depT(atC) : depT(d2) + r.fallbackMin[1] * MIN;
        // Aynı aktarma trenine yetişen birden fazla tren varsa en geç çıkılanı göster
        byTrain.set(d2.tripCode + "|" + depT(d2), { d1, d2, arrB, arrC, estimated: !atB || !atC });
      }
      const cancelled = first.filter((d) => d.cancelled).slice(0, 3);
      return { list: [...byTrain.values()].sort((a, b) => depT(a.d1) - depT(b.d1)).slice(0, 4), cancelled };
    }

    function delayTag(d) {
      if (d.cancelled) return '<span class="late">iptal</span>';
      if (!d.realtime) return "";
      const m = d.delayInMinutes || 0;
      return m > 0 ? `<span class="late">+${m} dk</span>` : '<span class="ontime">zamanında</span>';
    }

    function renderConnections(res, now) {
      const r = TRANSIT.routes[route], N = TRANSIT.names;
      const walk = TRANSIT.walkMin[r.from] || 0;
      if (!res.list.length) {
        $("conns").innerHTML = '<div class="empty">Önümüzdeki dakikalarda uygun bağlantı bulunamadı.</div>';
        return;
      }
      let html = res.list.map(({ d1, d2, arrB, arrC, estimated }) => {
        const leave = depT(d1) - walk * MIN;
        const inMin = Math.round((leave - now) / MIN);
        const wait = Math.max(0, Math.round((depT(d2) - arrB) / MIN));
        const xferText = wait <= 1 ? "hemen aktarma (trenler bekleşiyor)" : `${wait} dk bekleme`;
        return `<div class="conn">
          <div class="conn-top">
            <span class="times">${hhmm(depT(d1))} → ${estimated ? "~" : ""}${hhmm(arrC)}</span>
            <span class="dur">${Math.round((arrC - depT(d1)) / MIN)} dk</span>
            <span class="in">${inMin <= 0 ? "şimdi" : inMin + " dk sonra"}</span>
          </div>
          <div class="legs">
            ${walk ? `<div class="walk">🚶 ${hhmm(leave)}'de çık (${walk} dk yürüme)</div>` : ""}
            <div class="leg"><span class="line ${esc(d1.label)}">${esc(d1.label)}</span> ${hhmm(depT(d1))} ${N[r.from]} ${delayTag(d1)}</div>
            <div class="xfer">↓ ${N[r.via]} · ${xferText}</div>
            <div class="leg"><span class="line ${esc(d2.label)}">${esc(d2.label)}</span> ${hhmm(depT(d2))} → ${estimated ? "~" : ""}${hhmm(arrC)} ${N[r.to]} ${delayTag(d2)}</div>
          </div>
        </div>`;
      }).join("");
      if (res.cancelled.length) {
        html += `<p class="est" style="margin:10px 0 0">İptal edilen seferler: ${res.cancelled.map((d) => `${esc(d.label)} ${hhmm(d.plannedDepartureTime)}`).join(", ")}</p>`;
      }
      html += `<p class="est" style="margin:12px 0 4px">Güncellendi ${hhmm(now)} · <button class="refresh" type="button" id="transitRefresh">Yenile</button></p>`;
      $("conns").innerHTML = html;
      $("transitRefresh").addEventListener("click", loadTransit);
    }

    function renderStatus(messages) {
      const box = $("transitStatus");
      box.hidden = false;
      const now = Date.now();
      const active = (messages || []).filter((m) => {
        const spans = m.incidentDurations?.length ? m.incidentDurations : [{ from: m.validFrom, to: m.validTo }];
        return spans.some((s) => (s.from ?? 0) <= now + 24 * 60 * MIN && (s.to ?? 9e15) >= now);
      });
      const title = `<h3>🚇 ${TRANSIT.lines.join(" / ")} durumu</h3>`;
      if (!active.length) { box.innerHTML = title + '<div class="ok">✅ Bilinen aksaklık yok.</div>'; return; }
      box.innerHTML = title + active.map((m) => {
        const lines = [...new Set((m.lines || []).map((l) => l.label).filter((l) => TRANSIT.lines.includes(l)))].join("/");
        const icon = m.type === "INCIDENT" ? "⚠️" : "🚧";
        const until = m.validTo ? ` · bitiş ${new Date(m.validTo).toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" })}` : "";
        const body = DOMPurify.sanitize(m.description || "", { ALLOWED_TAGS: ["br", "p", "ul", "li", "b", "strong", "em"] });
        return `<details><summary>${icon} ${esc(lines)}: ${esc(m.title)}</summary><div class="msg-body">${body}<div class="est">${until.slice(3)}</div></div></details>`;
      }).join("");
    }

    async function mvgCall(body) {
      const { data, error } = await sb.functions.invoke("mvg", {
        body,
        headers: { apikey: CFG.SUPABASE_PUBLISHABLE_KEY },
      });
      if (error) throw error;
      return data;
    }

    async function loadTransit() {
      clearTimeout(transitTimer);
      for (const b of document.querySelectorAll(".seg button")) b.setAttribute("aria-pressed", String(b.dataset.route === route));
      try {
        const r = TRANSIT.routes[route];
        const ids = [r.from, r.via, r.to].map((k) => TRANSIT.stations[k]);
        const [deps, msgs] = await Promise.all([
          mvgCall({ action: "departures", stations: ids }),
          mvgCall({ action: "messages", lines: TRANSIT.lines }).catch(() => null),
        ]);
        const now = Date.now();
        renderConnections(findConnections(r, deps, now), now);
        if (msgs) renderStatus(msgs);
      } catch (err) {
        $("conns").innerHTML = `<div class="empty">Ulaşım verisi alınamadı.<br><small>${esc(err.message || err)}</small></div>`;
      }
      // Sekme açıkken 30 saniyede bir yenile
      transitTimer = setTimeout(() => { if (currentTab === "ulasim" && !document.hidden) loadTransit(); }, 30 * 1000);
    }
    for (const b of document.querySelectorAll(".seg button")) {
      b.addEventListener("click", () => { route = b.dataset.route; $("conns").innerHTML = '<div class="empty">Yükleniyor…</div>'; loadTransit(); });
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden && currentTab === "ulasim") loadTransit(); });

    // ---------- Gmail'i aç ----------
    // iPhone'da Gmail uygulamasını açar; uygulama yüklü değilse web'deki Gmail'e geçer.
    // Diğer cihazlarda mail.google.com açılır (Android bunu Gmail uygulamasında açar).
    $("openMail").addEventListener("click", (e) => {
      if (!isIOS) return; // normal link: mail.google.com
      e.preventDefault();
      let left = false;
      const onHide = () => { if (document.hidden) left = true; };
      document.addEventListener("visibilitychange", onHide);
      window.location.href = "googlegmail://";
      setTimeout(() => {
        document.removeEventListener("visibilitychange", onHide);
        if (!left && !document.hidden) window.location.href = "https://mail.google.com/mail/";
      }, 1500);
    });

    // ---------- Başlat ----------
    // Bildirimden (?d=...) gelindiyse mailler, değilse son açık bırakılan sekme
    let startTab = "mail";
    try { startTab = localStorage.getItem("asistan-tab") || "mail"; } catch (e) { /* önemli değil */ }
    const qs = new URLSearchParams(location.search);
    if (["hava", "ulasim"].includes(qs.get("tab"))) startTab = qs.get("tab");
    if (qs.get("d")) startTab = "mail";
    showTab(["hava", "ulasim"].includes(startTab) ? startTab : "mail");

    sb.auth.getSession().then(({ data }) => (data.session ? showApp() : showLogin()));
  })();
  </script>
