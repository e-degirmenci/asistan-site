<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Asistan</title>
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Asistan">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <style>
    :root {
      --bg: #f6f5f1;
      --surface: #ffffff;
      --text: #1b1c1f;
      --muted: #6b6e76;
      --line: #e6e4dd;
      --accent: #3b5bdb;
      --accent-soft: #e8ecfb;
      --danger: #c92a2a;
      --radius: 16px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121316;
        --surface: #1b1d21;
        --text: #ececee;
        --muted: #9a9ca3;
        --line: #2b2e34;
        --accent: #8ea4ff;
        --accent-soft: #232a45;
        --danger: #ff8787;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 48px; }
    [hidden] { display: none !important; }

    /* Üst bar */
    header { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 18px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; }
    .brand img { width: 30px; height: 30px; border-radius: 8px; }
    .icon-btn {
      border: 1px solid var(--line); background: var(--surface); color: var(--muted);
      border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer;
    }

    /* Giriş */
    .login { max-width: 360px; margin: 12vh auto 0; text-align: center; }
    .login img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 12px; }
    .login h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
    .login p { color: var(--muted); margin: 0 0 24px; font-size: 15px; }
    .login form { display: grid; gap: 10px; text-align: left; }
    input {
      width: 100%; font: inherit; padding: 13px 14px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    .btn {
      font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 13px 16px;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { .btn { color: #0f1220; } }
    .btn:disabled { opacity: .6; cursor: default; }
    .error { color: var(--danger); font-size: 14px; min-height: 20px; margin: 4px 0 0; }

    /* Bildirim kutusu */
    .notice {
      display: flex; gap: 12px; align-items: center; justify-content: space-between;
      background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px;
      font-size: 15px;
    }
    .notice .btn { padding: 9px 14px; font-size: 15px; white-space: nowrap; }

    /* Tarih seçici */
    .days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; margin: 0 -2px 4px; scrollbar-width: none; }
    .days::-webkit-scrollbar { display: none; }
    .day {
      flex: 0 0 auto; font: inherit; font-size: 14px; padding: 7px 13px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer;
    }
    .day[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* Özet kartı */
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 20px 8px; }
    .card .meta { color: var(--muted); font-size: 14px; margin-bottom: 4px; }
    .card h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 12px; line-height: 1.3; }
    .md h2 { font-size: 17px; margin: 22px 0 6px; padding-top: 14px; border-top: 1px solid var(--line); }
    .md h2:first-child { border-top: 0; padding-top: 0; margin-top: 4px; }
    .md p { margin: 0 0 12px; }
    .md ul { padding-left: 20px; margin: 0 0 12px; }
    .md li { margin: 6px 0; }
    .md li::marker { color: var(--muted); }
    .md strong { font-weight: 650; }
    .md a { color: var(--accent); }
    .md code { font-size: .9em; background: var(--bg); padding: 1px 5px; border-radius: 5px; }
    .empty { color: var(--muted); text-align: center; padding: 48px 12px; }

    /* Sekmeler */
    .tabs {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; padding: 4px; margin-bottom: 16px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    }
    .tab {
      font: inherit; font-size: 12px; font-weight: 600; padding: 7px 0 6px; border: 0; border-radius: 10px; white-space: nowrap;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: transparent; color: var(--muted); cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--text); color: var(--bg); }
    .tab .ti { font-size: 19px; line-height: 1.1; }
    @media (max-width: 430px) { .tab { font-size: 11px; } }
    @media (max-width: 380px) { .tab { font-size: 10px; letter-spacing: -0.01em; } .tab .ti { font-size: 18px; } .tabs { padding: 3px; } }

    /* Bugün */
    .hello { margin: 2px 2px 14px; }
    .hello h2 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
    .tcard { cursor: pointer; margin-bottom: 12px; padding: 14px 16px; }
    .tcard:active { transform: scale(.99); }
    .tc-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .02em; margin-bottom: 6px; }
    .tc-head .go { font-size: 18px; line-height: 1; }
    .tc-big { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .tc-line { font-size: 15px; margin-top: 4px; }
    .tc-line.muted { color: var(--muted); font-size: 14px; }
    .tc-line.warn { color: var(--danger); font-size: 14px; }
    .tc-list { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 15px; }

    /* Ulaşım */
    .picker { display: grid; gap: 8px; margin-bottom: 12px; }
    .pick-row { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 8px; }
    .pick-row > span { color: var(--muted); font-size: 13px; font-weight: 600; }
    .seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .seg3 button {
      font: inherit; font-size: 14px; font-weight: 600; padding: 9px 4px; border-radius: 11px; cursor: pointer;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
    }
    .seg3 button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .conn { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .conn:first-of-type { padding-top: 4px; }
    .conn:last-of-type { border-bottom: 0; }
    .conn-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .conn-top .times { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .conn-top .dur { color: var(--muted); font-size: 14px; }
    .conn-top .in { margin-left: auto; font-size: 14px; font-weight: 650; color: var(--accent); }
    .legs { margin-top: 8px; font-size: 15px; display: grid; gap: 5px; }
    .leg { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .line {
      display: inline-block; min-width: 30px; text-align: center; font-size: 13px; font-weight: 700;
      padding: 2px 6px; border-radius: 6px; color: #fff;
    }
    .line.U2 { background: #c3022d; } .line.U3 { background: #ec6726; } .line.U6 { background: #0065ae; }
    .xfer { color: var(--muted); font-size: 13px; padding-left: 2px; }
    .ontime { color: #2f9e44; font-size: 13px; }
    .late { color: var(--danger); font-size: 13px; font-weight: 650; }
    .est { color: var(--muted); font-size: 12px; }
    .walk { color: var(--muted); font-size: 13px; }
    .status h3 { font-size: 15px; margin: 0 0 8px; }
    .status .ok { color: #2f9e44; }
    .status details { margin: 8px 0; }
    .status summary { cursor: pointer; font-weight: 600; }
    .status .msg-body { font-size: 14px; color: var(--muted); margin-top: 6px; }
    .refresh { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 0; }

    /* Hava durumu */
    .wx-now { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .wx-now .big { font-size: 56px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
    .wx-now .icon { font-size: 52px; line-height: 1; }
    .wx-now .desc { font-size: 17px; font-weight: 600; margin-top: 6px; }
    .wx-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .wx-brief { background: var(--accent-soft); border-color: transparent; margin-bottom: 14px; padding-bottom: 16px; }
    .wx-brief h2 { font-size: 18px; margin: 0 0 8px; letter-spacing: -0.01em; }
    .wx-brief p { margin: 0 0 12px; }
    .wx-brief .prep-title { font-size: 14px; font-weight: 650; color: var(--muted); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; }
    .wx-brief ul { list-style: none; padding: 0; margin: 0; }
    .wx-brief li { margin: 6px 0; }
    .wx-h { font-size: 15px; font-weight: 650; margin: 22px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
    .wx-hours { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 0 4px 4px; }
    .wx-hours::-webkit-scrollbar { display: none; }
    .wx-hour {
      flex: 0 0 auto; width: 58px; text-align: center; padding: 10px 4px; border-radius: 12px;
      background: var(--bg); font-size: 14px;
    }
    .wx-hour .t { color: var(--muted); font-size: 13px; }
    .wx-hour .e { font-size: 22px; margin: 4px 0; }
    .wx-hour .r { color: var(--accent); font-size: 12px; min-height: 16px; }
    .wx-days { list-style: none; padding: 0; margin: 0; }
    .wx-days li {
      display: grid; grid-template-columns: 84px 30px 1fr auto; align-items: center; gap: 8px;
      padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px;
    }
    .wx-days li:last-child { border-bottom: 0; }
    .wx-days .r { color: var(--accent); font-size: 13px; }
    .wx-days .mm { font-variant-numeric: tabular-nums; }
    .wx-days .mm span { color: var(--muted); }

    /* Gym */
    .gym-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .gym-head h1 { margin-bottom: 2px; }
    .btn-ghost {
      font: inherit; font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 10px; cursor: pointer;
      border: 1px solid var(--line); background: var(--bg); color: var(--text); white-space: nowrap;
    }
    .btn-ghost.danger { color: var(--danger); }
    .ex-list { list-style: none; padding: 0; margin: 14px 0 6px; counter-reset: ex; }
    .ex-list li { border-top: 1px solid var(--line); }
    .ex-name { font-weight: 650; }
    .ex-meta { color: var(--muted); font-size: 15px; margin-top: 2px; }
    .ex-note { font-size: 14px; margin-top: 4px; }
    .gym-edit label { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 12px 0 5px; }
    .gym-edit input, .gym-edit select {
      width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
    }
    .ex-edit { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 10px; display: grid; gap: 8px; }
    .ex-edit .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .ex-edit .lbls span { font-size: 12px; color: var(--muted); font-weight: 600; padding-left: 4px; }
    .ex-edit .tools { display: flex; gap: 6px; justify-content: flex-end; }
    .ex-edit .tools button { padding: 5px 10px; font-size: 14px; }
    .gym-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 6px; }
    .gym-actions .btn { flex: 1; }
    .day.add { border-style: dashed; color: var(--muted); }
    .gym-info { font-size: 14px; color: var(--muted); margin: -4px 2px 10px; line-height: 1.5; }
    .gym-info b { color: var(--text); font-weight: 650; }
    .gym-status { font-size: 14px; padding: 9px 12px; border-radius: 10px; background: var(--accent-soft); margin: 12px 0 0; }
    .gym-status.ok { background: rgba(47, 158, 68, .14); }
    .ex-head {
      width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 0; border: 0; background: none;
      font: inherit; color: var(--text); text-align: left; cursor: pointer;
    }
    .ex-head .badge {
      flex: 0 0 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700;
    }
    .ex-head .ex-name { flex: 1; }
    .ex-head .chev { color: var(--muted); font-size: 13px; }
    .ex-prog { font-size: 13px; font-weight: 650; color: var(--accent); }
    .ex-prog.ok { color: #2f9e44; }
    .ex.complete .badge { background: #2f9e44; color: #fff; }
    .ex.complete .ex-name { color: var(--muted); }
    .ex-body { padding: 0 0 14px; }
    .ex-target { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    .sets { display: grid; gap: 8px; margin-top: 4px; }
    .set { display: grid; grid-template-columns: 46px 72px 26px 64px 1fr 56px; align-items: center; gap: 6px; }
    .set .sn { color: var(--muted); font-size: 13px; font-weight: 700; }
    .set input {
      width: 100%; min-width: 0; font: inherit; font-size: 17px; text-align: center; padding: 9px 4px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text); font-variant-numeric: tabular-nums;
    }
    .set .x { color: var(--muted); font-size: 13px; }
    .set .cardio { grid-column: 1 / 6; color: var(--muted); font-size: 15px; }
    .set .chk {
      grid-column: 6; width: 56px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg);
      color: var(--line); font-size: 20px; font-weight: 700; cursor: pointer;
    }
    .set.done .chk { background: #2f9e44; border-color: #2f9e44; color: #fff; }
    .set.done input { border-color: rgba(47, 158, 68, .5); }
    .prev { display: block; border: 0; background: none; padding: 0; margin-top: 8px; font: inherit; font-size: 13px; color: var(--muted); text-align: left; cursor: pointer; }
    .hist { font-size: 13px; color: var(--muted); margin-top: 4px; padding-left: 10px; border-left: 2px solid var(--line); display: grid; gap: 2px; }

    /* Market ve To-do listeleri */
    .list-card { padding-bottom: 14px; }
    .add-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 2px 0 10px; }
    .add-row input { padding: 11px 13px; font-size: 16px; background: var(--bg); }
    .add-row .btn { padding: 0 18px; font-size: 22px; line-height: 1; }
    .items { list-style: none; padding: 0; margin: 0; }
    .item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
    .item:first-child { border-top: 0; }
    .tick {
      flex: 0 0 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--bg);
      color: transparent; font-size: 16px; font-weight: 700; cursor: pointer; display: grid; place-items: center; padding: 0;
    }
    .item.done .tick { background: #2f9e44; border-color: #2f9e44; color: #fff; }
    .item .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
    .item.done .nm { color: var(--muted); text-decoration: line-through; }
    .item .del { border: 0; background: none; color: var(--muted); font-size: 20px; padding: 2px 6px; cursor: pointer; line-height: 1; }
    .sub-h { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .02em; margin: 16px 0 2px; }
    .sub-h button { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 0; }

    /* Ders */
    .seg4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .seg4 button {
      font: inherit; font-size: 13px; font-weight: 600; padding: 9px 2px; border-radius: 12px; cursor: pointer; white-space: nowrap;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
    }
    .seg4 button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .cdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; vertical-align: 1px; }
    .sub-h.first { margin-top: 2px; }
    .wk-day { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; margin: 18px 0 2px; }
    .wk-day:first-child { margin-top: 0; }
    .wk-day.today { color: var(--accent); }
    .slot { display: flex; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
    .wk-day + .slot { border-top: 0; }
    .slot .tm { flex: 0 0 46px; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; line-height: 1.25; }
    .slot .tm span { display: block; color: var(--muted); font-weight: 500; font-size: 13px; }
    .slot .sl-main { flex: 1; min-width: 0; }
    .slot .sl-name { font-weight: 600; }
    .slot .sl-sub { color: var(--muted); font-size: 14px; margin-left: 16px; }
    .badge { font-size: 11px; font-weight: 700; color: #fff; border-radius: 6px; padding: 1px 6px; margin-left: 8px; vertical-align: 2px; }
    .badge.now { background: #2f9e44; } .badge.next { background: var(--accent); }
    @media (prefers-color-scheme: dark) { .badge.next { color: #0f1220; } }
    .crs { width: 100%; display: block; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; font: inherit; color: var(--text); padding: 12px 0; cursor: pointer; }
    .sub-h + .crs { border-top: 0; }
    .crs-top { display: flex; align-items: center; gap: 10px; }
    .crs-top .nm { flex: 1; font-weight: 650; min-width: 0; }
    .crs-top .chev { color: var(--muted); }
    .crs .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0 20px; }
    .gr { font-weight: 700; font-variant-numeric: tabular-nums; }
    .gr.muted { color: var(--muted); font-weight: 500; font-size: 14px; } .gr.bad { color: var(--danger); font-size: 14px; }
    .bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 8px 0 0 20px; }
    .bar.wide { margin-left: 0; margin-top: 6px; }
    .bar i { display: block; height: 100%; border-radius: 99px; min-width: 0; }
    .due { font-size: 13px; color: var(--muted); text-decoration: none; display: inline-block; }
    .due.soon { color: #e8590c; font-weight: 650; } .due.over { color: var(--danger); font-weight: 650; }
    .item.done .due { text-decoration: line-through; }
    .back { border: 0; background: none; color: var(--accent); font: inherit; font-size: 15px; padding: 0; cursor: pointer; margin: 0 0 10px; }
    .crs-info { font-size: 14px; color: var(--muted); display: grid; gap: 3px; margin: 8px 0 0; }
    .due-row { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; margin: -2px 0 10px; font-size: 13px; color: var(--muted); }
    .due-row input { font: inherit; font-size: 14px; padding: 7px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); width: auto; min-width: 0; }
    .form label { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 12px 0 5px; }
    .form label.check { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 15px; font-weight: 500; margin-top: 14px; }
    .form label.check input { width: 20px; height: 20px; margin: 0; }
    .form input, .form select {
      width: 100%; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
    }
    .form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .colors { display: flex; gap: 8px; flex-wrap: wrap; }
    .colors button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--surface); outline: 2px solid transparent; cursor: pointer; padding: 0; }
    .colors button[aria-pressed="true"] { outline-color: var(--text); }
    .slot-edit { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 8px; display: grid; gap: 8px; }
    .slot-edit .r { display: grid; grid-template-columns: 0.8fr 1.1fr 1.1fr; gap: 6px; }
    .slot-edit .r2 { display: grid; grid-template-columns: 1.1fr 1fr auto; gap: 6px; }
    .slot-edit input, .slot-edit select { padding: 9px 8px; font-size: 15px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
    .stat { background: var(--bg); border-radius: 14px; padding: 12px 14px; }
    .stat .k { color: var(--muted); font-size: 13px; font-weight: 600; }
    .stat .v { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
    .stat .s { color: var(--muted); font-size: 12px; }
    .exam { padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
    .exam:first-child, .sub-h + .exam { border-top: 0; }
    .exam-top { display: flex; gap: 10px; align-items: center; }
    .exam-top .nm { flex: 1; font-weight: 650; }
    .exam .cd { font-weight: 700; font-size: 15px; white-space: nowrap; color: var(--accent); }
    .exam .sub { color: var(--muted); font-size: 14px; margin: 2px 0 0 20px; }
    .exam .warn { color: var(--danger); font-size: 14px; margin: 6px 0 0 20px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .exam .ok { color: #2f9e44; font-size: 14px; margin: 4px 0 0 20px; }
    .exam.past { opacity: .55; }
    .mini-btn { font: inherit; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }

    /* Gym oyunlaştırma */
    .gx { padding: 14px 16px; margin-bottom: 12px; }
    .gx-top { display: flex; align-items: center; gap: 12px; }
    .lvl {
      flex: 0 0 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
      font-size: 22px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #f08c00, #e8590c);
      box-shadow: 0 4px 12px rgba(232, 89, 12, .3);
    }
    .gx-main { flex: 1; min-width: 0; }
    .gx-title { font-weight: 700; font-size: 16px; }
    .xpbar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 6px 0 4px; }
    .xpbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #f08c00, #e8590c); transition: width .4s; }
    .gx-sub { color: var(--muted); font-size: 12px; }
    .gx-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    .gx-streak { display: flex; align-items: center; gap: 6px; }
    .gx-streak .fl { font-size: 28px; line-height: 1; }
    .gx-streak b { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
    .gx-streak span:last-child { color: var(--muted); font-size: 12px; line-height: 1.2; }
    .gx-streak.off .fl { filter: grayscale(1); opacity: .45; }
    .gx-week { flex: 1; min-width: 0; text-align: right; }
    .wdots { display: inline-flex; gap: 4px; }
    .wdots i {
      width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal;
      font-size: 11px; font-weight: 700; background: var(--bg); color: var(--muted); border: 1.5px solid var(--line);
    }
    .wdots i.on { background: #2f9e44; border-color: #2f9e44; color: #fff; }
    .wdots i.today:not(.on) { border-color: var(--accent); color: var(--accent); }
    .gx-goal { display: block; margin: 6px 0 0 auto; border: 0; background: none; padding: 0; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; }
    .gx-goal b { color: var(--text); }
    .gx-goal-edit { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 14px; margin-top: 8px; }
    .gx-goal-edit .mini-btn { width: 32px; padding: 4px 0; font-size: 16px; }
    .gx-note { font-size: 14px; margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); }
    .gx-bhead { width: 100%; display: flex; justify-content: space-between; align-items: center; border: 0; background: none; padding: 0; font: inherit; font-weight: 650; color: var(--text); cursor: pointer; }
    #gymBadges { margin-top: 12px; padding: 14px 16px; }
    .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .bdg { text-align: center; padding: 10px 4px 8px; border-radius: 12px; background: var(--bg); }
    .bdg .bi { font-size: 26px; line-height: 1.1; filter: grayscale(1); opacity: .35; }
    .bdg .bn { font-size: 12px; font-weight: 650; margin-top: 4px; color: var(--muted); }
    .bdg .bd { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
    .bdg.got { background: rgba(240, 140, 0, .12); }
    .bdg.got .bi { filter: none; opacity: 1; }
    .bdg.got .bn { color: var(--text); }
    .bdg.got .bd { color: #e8590c; font-weight: 600; }
    .set .sn.pr { font-size: 18px; }
    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
      background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 650; font-size: 15px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .25); max-width: calc(100% - 32px); text-align: center;
    }

    /* Gmail butonu: kaydırırken altta sabit kalır, sayfa sonunda kartın altına oturur */
    .open-mail {
      position: sticky; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 5;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; margin-top: 16px; padding: 15px 16px; border-radius: 14px;
      font: inherit; font-weight: 600; text-decoration: none;
      background: var(--text); color: var(--bg); border: 0; cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
    }
    .open-mail:active { transform: scale(.98); }
    .open-mail svg { width: 22px; height: 22px; flex: 0 0 auto; }
    footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Giriş ekranı -->
    <section id="login" class="login" hidden>
      <img src="icon-192.png" alt="">
      <h1>Asistan</h1>
      <p>Günlük mail özetlerin</p>
      <form id="loginForm">
        <input id="email" type="email" autocomplete="username" placeholder="E-posta" required>
        <input id="password" type="password" autocomplete="current-password" placeholder="Şifre" required>
        <button class="btn" id="loginBtn" type="submit">Giriş yap</button>
        <p class="error" id="loginError" role="alert"></p>
      </form>
    </section>

    <!-- Ana ekran -->
    <section id="app" hidden>
      <header>
        <div class="brand"><img src="icon-192.png" alt="">Asistan</div>
        <button class="icon-btn" id="logout" type="button">Çıkış</button>
      </header>

      <div class="notice" id="notice" hidden>
        <span id="noticeText"></span>
        <button class="btn" id="noticeBtn" type="button" hidden>Aç</button>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" type="button" data-tab="bugun" aria-selected="true"><span class="ti">🏠</span>Bugün</button>
        <button class="tab" role="tab" type="button" data-tab="mail" aria-selected="false"><span class="ti">📬</span>Mail</button>
        <button class="tab" role="tab" type="button" data-tab="hava" aria-selected="false"><span class="ti">🌤️</span>Hava</button>
        <button class="tab" role="tab" type="button" data-tab="ulasim" aria-selected="false"><span class="ti">🚇</span>Ulaşım</button>
        <button class="tab" role="tab" type="button" data-tab="ders" aria-selected="false"><span class="ti">🎓</span>Ders</button>
        <button class="tab" role="tab" type="button" data-tab="gym" aria-selected="false"><span class="ti">🏋️</span>Gym</button>
        <button class="tab" role="tab" type="button" data-tab="market" aria-selected="false"><span class="ti">🛒</span>Market</button>
        <button class="tab" role="tab" type="button" data-tab="todo" aria-selected="false"><span class="ti">✅</span>To-do</button>
      </div>

      <!-- Sekme: Bugün -->
      <div id="tab-bugun" role="tabpanel">
        <div class="hello"><h2 id="helloTitle"></h2><div id="helloDate" class="wx-sub"></div></div>
        <article class="card tcard" id="tWx" data-goto="hava"><div class="tc-head"><span>🌤️ Hava</span><span class="go">›</span></div><div class="tc-body est">Yükleniyor…</div></article>
        <article class="card tcard" id="tTransit" data-goto="ulasim"><div class="tc-head"><span>🚇 Ulaşım</span><span class="go">›</span></div><div class="tc-body est">Yükleniyor…</div></article>
        <article class="card tcard" id="tDers" data-goto="ders"><div class="tc-head"><span>🎓 Ders</span><span class="go">›</span></div><div class="tc-body est">Yükleniyor…</div></article>
        <article class="card tcard" id="tTodo" data-goto="todo"><div class="tc-head"><span>✅ To-do</span><span class="go">›</span></div><div class="tc-body est">Yükleniyor…</div></article>
        <article class="card tcard" id="tGym" data-goto="gym"><div class="tc-head"><span>🏋️ Gym</span><span class="go">›</span></div><div class="tc-body est">Yükleniyor…</div></article>
        <article class="card tcard" id="tMail" data-goto="mail"><div class="tc-head"><span>📬 Mail</span><span class="go">›</span></div><div class="tc-body est">Yükleniyor…</div></article>
        <article class="card tcard" id="tGrocery" data-goto="market"><div class="tc-head"><span>🛒 Market</span><span class="go">›</span></div><div class="tc-body est">Yükleniyor…</div></article>
      </div>

      <!-- Sekme: E-mailler -->
      <div id="tab-mail" role="tabpanel" hidden>
        <nav class="days" id="days" aria-label="Günler"></nav>
        <article class="card" id="card">
          <div class="empty">Yükleniyor…</div>
        </article>
        <a class="open-mail" id="openMail" href="https://mail.google.com/mail/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2.5"></rect>
            <path d="M3.5 6.5 12 13l8.5-6.5"></path>
          </svg>
          Gmail'i aç
        </a>
      </div>

      <!-- Sekme: Hava durumu -->
      <div id="tab-hava" role="tabpanel" hidden>
        <article class="card wx-brief" id="wxBrief" hidden></article>
        <article class="card" id="wx">
          <div class="empty">Yükleniyor…</div>
        </article>
      </div>

      <!-- Sekme: Ulaşım -->
      <div id="tab-ulasim" role="tabpanel" hidden>
        <div class="picker" id="picker"></div>
        <article class="card" id="conns"><div class="empty">Yükleniyor…</div></article>
        <article class="card status" id="transitStatus" style="margin-top:14px" hidden></article>
      </div>

      <!-- Sekme: Gym -->
      <div id="tab-gym" role="tabpanel" hidden>
        <div class="card gx" id="gymStats" hidden></div>
        <div class="gym-info" id="gymInfo" hidden></div>
        <nav class="days" id="gymDays" aria-label="Program günleri"></nav>
        <article class="card" id="gymCard"><div class="empty">Yükleniyor…</div></article>
        <article class="card" id="gymBadges" hidden></article>
      </div>

      <!-- Sekme: Ders -->
      <div id="tab-ders" role="tabpanel" hidden>
        <div class="seg4" id="dersSeg">
          <button type="button" data-sub="program" aria-pressed="true">📅 Program</button>
          <button type="button" data-sub="dersler" aria-pressed="false">📚 Dersler</button>
          <button type="button" data-sub="sinav" aria-pressed="false">📝 Sınavlar</button>
          <button type="button" data-sub="notlar" aria-pressed="false">🎓 Notlar</button>
        </div>
        <article class="card" id="dersCard" style="padding-bottom:16px"><div class="empty">Yükleniyor…</div></article>
      </div>

      <!-- Sekme: Market -->
      <div id="tab-market" role="tabpanel" hidden>
        <article class="card list-card">
          <div class="add-row">
            <input id="marketIn" placeholder="Ne alınacak? (ör. süt, ekmek)" autocomplete="off" enterkeyhint="done" aria-label="Ürün ekle">
            <button class="btn" type="button" id="marketAdd" aria-label="Ekle">+</button>
          </div>
          <div id="marketItems"><div class="empty">Yükleniyor…</div></div>
          <p class="error" id="marketErr"></p>
        </article>
      </div>

      <!-- Sekme: To-do -->
      <div id="tab-todo" role="tabpanel" hidden>
        <article class="card list-card">
          <div class="add-row">
            <input id="todoIn" placeholder="Yapılacak bir şey ekle" autocomplete="off" enterkeyhint="done" aria-label="Yapılacak ekle">
            <button class="btn" type="button" id="todoAdd" aria-label="Ekle">+</button>
          </div>
          <div id="todoItems"><div class="empty">Yükleniyor…</div></div>
          <p class="error" id="todoErr"></p>
        </article>
      </div>

      <footer id="footer"></footer>
    </section>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.76.1/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@16.4.1/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script>
  (function () {
    const CFG = window.ASISTAN_CONFIG || {};
    const $ = (id) => document.getElementById(id);
    if (!/^https:\/\//.test(CFG.SUPABASE_URL || "") || !CFG.SUPABASE_PUBLISHABLE_KEY || CFG.SUPABASE_PUBLISHABLE_KEY.startsWith("__")) {
      document.querySelector(".wrap").innerHTML = '<p class="empty">config.js henüz doldurulmamış.</p>';
      return;
    }
    const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_PUBLISHABLE_KEY);

    let digests = [];
    let current = null;

    // ---------- Yardımcılar ----------
    const AYLAR = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
    function todayStr(offsetDays = 0) {
      const d = new Date(Date.now() + offsetDays * 86400000);
      return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Berlin" }).format(d);
    }
    function dayLabel(dateStr) {
      if (dateStr === todayStr()) return "Bugün";
      if (dateStr === todayStr(-1)) return "Dün";
      const [, m, d] = dateStr.split("-").map(Number);
      return `${d} ${AYLAR[m - 1]}`;
    }
    function renderMarkdown(md) {
      // Resim/dış içerik yüklenmesin (mail içeriğinden gelen takip pikselleri vb.)
      return DOMPurify.sanitize(marked.parse(md || ""), { USE_PROFILES: { html: true }, FORBID_TAGS: ["img", "style", "form", "input"] });
    }
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

    // ---------- Ekranlar ----------
    function showLogin() {
      $("app").hidden = true;
      $("login").hidden = false;
    }
    async function showApp() {
      $("login").hidden = true;
      $("app").hidden = false;
      loggedIn = true;
      if (currentTab === "ulasim") loadTransit();
      if (currentTab === "gym") loadGym();
      if (currentTab === "hava") loadWeather();
      if (LISTS[currentTab]) loadList(currentTab);
      if (currentTab === "ders") loadDers();
      await loadDigests();
      if (currentTab === "bugun") loadToday();
      await refreshNotice();
    }

    // ---------- Giriş / çıkış ----------
    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("loginError").textContent = "";
      $("loginBtn").disabled = true;
      const { error } = await sb.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value,
      });
      $("loginBtn").disabled = false;
      if (error) {
        $("loginError").textContent = "Giriş yapılamadı: e-posta veya şifre hatalı.";
        return;
      }
      showApp();
    });

    $("logout").addEventListener("click", async () => {
      await sb.auth.signOut();
      loggedIn = false;
      showLogin();
    });

    // ---------- Özetler ----------
    async function loadDigests() {
      const { data, error } = await sb
        .from("digests")
        .select("digest_date,title,summary_md,email_count,created_at")
        .order("digest_date", { ascending: false })
        .limit(60);

      if (error) {
        $("card").innerHTML = `<div class="empty">Özetler yüklenemedi.<br><small>${DOMPurify.sanitize(error.message)}</small></div>`;
        return;
      }
      digests = data || [];
      if (!digests.length) {
        $("days").innerHTML = "";
        $("card").innerHTML = '<div class="empty">Henüz özet yok.<br>İlk özet yarın sabah 09:00\'da gelecek.</div>';
        return;
      }
      const wanted = new URLSearchParams(location.search).get("d");
      const pick = digests.find((d) => d.digest_date === wanted) || digests[0];
      renderDays();
      select(pick.digest_date);
    }

    function renderDays() {
      const nav = $("days");
      nav.innerHTML = "";
      for (const d of digests) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "day";
        b.textContent = dayLabel(d.digest_date);
        b.dataset.date = d.digest_date;
        b.addEventListener("click", () => select(d.digest_date));
        nav.appendChild(b);
      }
    }

    function select(date) {
      current = digests.find((d) => d.digest_date === date);
      if (!current) return;
      for (const b of $("days").children) b.setAttribute("aria-pressed", String(b.dataset.date === date));
      $("card").innerHTML = "";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${current.email_count} mail`;
      const h = document.createElement("h1");
      h.textContent = current.title;
      const body = document.createElement("div");
      body.className = "md";
      body.innerHTML = renderMarkdown(current.summary_md);
      $("card").append(meta, h, body);
    }

    // ---------- Bildirimler ----------
    function setNotice(text, buttonText) {
      $("notice").hidden = !text;
      $("noticeText").textContent = text || "";
      $("noticeBtn").hidden = !buttonText;
      if (buttonText) $("noticeBtn").textContent = buttonText;
    }

    function base64ToUint8(b64) {
      const pad = "=".repeat((4 - (b64.length % 4)) % 4);
      const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
      return Uint8Array.from(raw, (c) => c.charCodeAt(0));
    }

    async function saveSubscription(sub) {
      const j = sub.toJSON();
      const { error } = await sb.from("push_subscriptions").upsert({
        endpoint: j.endpoint,
        p256dh: j.keys.p256dh,
        auth: j.keys.auth,
      });
      if (error) throw error;
    }

    async function refreshNotice() {
      if (!pushSupported) {
        if (isIOS && !isStandalone) {
          setNotice("Bildirim için: Safari'de Paylaş → “Ana Ekrana Ekle”, sonra uygulamayı ana ekrandan aç.");
        } else {
          setNotice("");
        }
        return;
      }
      try {
        const reg = await navigator.serviceWorker.register("sw.js");
        const existing = await reg.pushManager.getSubscription();
        if (Notification.permission === "granted" && existing) {
          await saveSubscription(existing); // kayıt güncel kalsın
          setNotice("");
          $("footer").textContent = "🔔 Bildirimler açık · her sabah 09:00";
          return;
        }
        if (Notification.permission === "denied") {
          setNotice("Bildirimler kapalı. Açmak için telefon Ayarları → Bildirimler → Asistan.");
          return;
        }
        setNotice("Her sabah özet hazır olunca bildirim al.", "Bildirimleri aç");
      } catch (err) {
        setNotice("Bildirim ayarlanamadı: " + err.message);
      }
    }

    $("noticeBtn").addEventListener("click", async () => {
      $("noticeBtn").disabled = true;
      try {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          setNotice("Bildirim izni verilmedi.");
          return;
        }
        const reg = await navigator.serviceWorker.ready;
        const sub = (await reg.pushManager.getSubscription()) ||
          (await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: base64ToUint8(CFG.VAPID_PUBLIC_KEY),
          }));
        await saveSubscription(sub);
        setNotice("");
        $("footer").textContent = "🔔 Bildirimler açık · her sabah 09:00";
      } catch (err) {
        setNotice("Bildirim açılamadı: " + err.message);
      } finally {
        $("noticeBtn").disabled = false;
      }
    });

    // ---------- Sekmeler ----------
    let wxLoadedAt = 0;
    let currentTab = "bugun";
    let loggedIn = false;
    function showTab(name) {
      for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-selected", String(b.dataset.tab === name));
      $("tab-bugun").hidden = name !== "bugun";
      $("tab-mail").hidden = name !== "mail";
      $("tab-hava").hidden = name !== "hava";
      $("tab-ulasim").hidden = name !== "ulasim";
      $("tab-gym").hidden = name !== "gym";
      $("tab-ders").hidden = name !== "ders";
      $("tab-market").hidden = name !== "market";
      $("tab-todo").hidden = name !== "todo";
      currentTab = name;
      if (!loggedIn) return;   // girişten önce veri çekme
      if (name === "bugun") loadToday();
      // Hava durumu: ilk açılışta ve 15 dakikadan eskiyse yenile
      if (name === "hava") loadWeather();
      if (name === "ulasim") loadTransit();
      if (name === "gym" && !gym.editing) loadGym();
      if (LISTS[name]) loadList(name);
      if (name === "ders") loadDers();
    }
    for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", () => showTab(b.dataset.tab));

    // ---------- Hava durumu (Münih, Open-Meteo, canlı) ----------
    const WMO = {
      0: ["Açık", "☀️"], 1: ["Çoğunlukla açık", "🌤️"], 2: ["Parçalı bulutlu", "⛅"], 3: ["Kapalı", "☁️"],
      45: ["Sisli", "🌫️"], 48: ["Kırağılı sis", "🌫️"],
      51: ["Hafif çisenti", "🌦️"], 53: ["Çisenti", "🌦️"], 55: ["Yoğun çisenti", "🌧️"],
      56: ["Donan çisenti", "🌧️"], 57: ["Yoğun donan çisenti", "🌧️"],
      61: ["Hafif yağmur", "🌦️"], 63: ["Yağmurlu", "🌧️"], 65: ["Şiddetli yağmur", "🌧️"],
      66: ["Donan yağmur", "🌧️"], 67: ["Şiddetli donan yağmur", "🌧️"],
      71: ["Hafif kar", "🌨️"], 73: ["Karlı", "🌨️"], 75: ["Yoğun kar", "❄️"], 77: ["Kar taneleri", "🌨️"],
      80: ["Hafif sağanak", "🌦️"], 81: ["Sağanak", "🌧️"], 82: ["Şiddetli sağanak", "⛈️"],
      85: ["Kar sağanağı", "🌨️"], 86: ["Yoğun kar sağanağı", "❄️"],
      95: ["Gök gürültülü fırtına", "⛈️"], 96: ["Dolulu fırtına", "⛈️"], 99: ["Şiddetli dolulu fırtına", "⛈️"],
    };
    const SNOW = [71, 73, 75, 77, 85, 86], STORM = [95, 96, 99];
    const GUN = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
    const wmo = (c) => WMO[c] || ["Bilinmiyor", "🌡️"];
    const icon = (c, isDay) => (!isDay && (c === 0 || c === 1)) ? "🌙" : wmo(c)[1];
    const r0 = (x) => Math.round(x);

    let wxData = null;
    async function fetchWeather() {
      if (wxData && Date.now() - wxLoadedAt < 10 * 60 * 1000) return wxData;
      const params = new URLSearchParams({
        latitude: "48.137", longitude: "11.575", timezone: "Europe/Berlin", forecast_days: "7",
        current: "temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m,is_day",
        hourly: "temperature_2m,apparent_temperature,precipitation_probability,weather_code,is_day",
        daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,wind_speed_10m_max,uv_index_max",
      });
      const res = await fetch("https://api.open-meteo.com/v1/forecast?" + params);
      if (!res.ok) throw new Error("HTTP " + res.status);
      wxData = await res.json();
      wxLoadedAt = Date.now();
      return wxData;
    }
    async function loadWeather() {
      try {
        renderWeather(await fetchWeather());
      } catch (err) {
        $("wx").innerHTML = '<div class="empty">Hava durumu alınamadı.<br><small>İnternet bağlantını kontrol edip sekmeye tekrar dokun.</small></div>';
      }
    }

    // "Bugün/Yarın" kutusu: günün özeti + neye göre hazırlanmalı (kurallara dayalı, anında)
    function buildBrief(w) {
      const c = w.current, d = w.daily, h = w.hourly;
      const nowHr = +c.time.slice(11, 13);
      const di = nowHr >= 20 && d.time.length > 1 ? 1 : 0; // akşam 20'den sonra yarını göster
      const day = d.time[di];
      const lc = (x) => x.toLocaleLowerCase("tr-TR");
      const pad = (n) => String(n).padStart(2, "0");
      const idx = (from, to) => h.time.map((t, i) => [t, i]).filter(([t]) => t.slice(0, 10) === day && +t.slice(11, 13) >= from && +t.slice(11, 13) <= to).map(([, i]) => i);
      const avg = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

      const tmin = r0(d.temperature_2m_min[di]), tmax = r0(d.temperature_2m_max[di]);
      const [desc, emo] = wmo(d.weather_code[di]);

      // Sabah / öğleden sonra / akşam
      const parts = [["Sabah", 7, 11], ["öğleden sonra", 12, 16], ["akşam", 17, 21]].map(([name, a, b]) => {
        const ii = idx(a, b);
        if (!ii.length) return null;
        const code = Math.max(...ii.map((i) => h.weather_code[i]));
        return `${name} ${wmo(code)[1]} ${lc(wmo(code)[0])} (${r0(avg(ii.map((i) => h.temperature_2m[i])))}°)`;
      }).filter(Boolean);

      // Yağış penceresi (08–22)
      const dayIdx = idx(8, 22);
      const rainy = dayIdx.filter((i) => (h.precipitation_probability[i] ?? 0) >= 50).map((i) => +h.time[i].slice(11, 13));
      const codes = new Set([d.weather_code[di], ...dayIdx.map((i) => h.weather_code[i])]);
      const snow = SNOW.some((x) => codes.has(x)), storm = STORM.some((x) => codes.has(x));
      let rainText = "Yağış beklenmiyor.";
      if (rainy.length) {
        const span = rainy[rainy.length - 1] + 1 - rainy[0];
        const kind = snow ? "Kar/yağış" : "Yağış";
        rainText = span >= 12 ? `${kind} gün boyu muhtemel.` : `${kind} ${pad(rainy[0])}:00–${pad(rainy[rainy.length - 1] + 1)}:00 arası bekleniyor.`;
      }
      const sunset = d.sunset[di].slice(11, 16);

      const lead = di === 0 ? "Bugün" : "Yarın";
      const text = `${lead} Münih'te hava ${lc(desc)}, sıcaklık ${tmin}° ile ${tmax}° arasında. ` +
        (parts.length ? parts.join(", ").replace(/^./, (m) => m.toUpperCase()) + ". " : "") +
        `${rainText} Gün batımı ${sunset}.`;

      // Hazırlık önerileri
      const feels = idx(7, 21).map((i) => h.apparent_temperature?.[i] ?? h.temperature_2m[i]);
      const fmin = feels.length ? Math.min(...feels) : tmin;
      const prep = [];
      if (fmin <= 0) prep.push(`🧣 Kalın mont, bere ve eldiven (hissedilen en düşük ${r0(fmin)}°).`);
      else if (fmin <= 8) prep.push(`🧥 Mont giy (hissedilen en düşük ${r0(fmin)}°).`);
      else if (fmin <= 14) prep.push("🧥 Ceket ya da kalın bir sweatshirt yeterli.");
      else if (fmin <= 20) prep.push("👕 Hafif bir ceket al, gerisi rahat.");
      else prep.push("😎 Tişört havası.");
      if (tmax - tmin >= 8) prep.push("🔄 Gün içinde sıcaklık epey değişiyor, kat kat giyin.");
      const windy = (d.wind_speed_10m_max[di] ?? 0) >= 40;
      if (rainy.length && !snow) prep.push(windy ? "🧥 Yağmur ve kuvvetli rüzgar var; şemsiye yerine kapüşonlu/su geçirmez mont daha iyi." : "☂️ Şemsiyeni unutma.");
      else if (windy) prep.push("💨 Kuvvetli rüzgar bekleniyor.");
      if (snow) prep.push("🥾 Kar var: kaymayan, su geçirmez ayakkabı giy.");
      else if (tmin <= 0) prep.push("🧊 Sabah ve akşam buzlanma olabilir, bisiklette dikkat.");
      if (storm) prep.push("⛈️ Gök gürültülü fırtına var, dışarıda uzun kalma.");
      if ((d.uv_index_max?.[di] ?? 0) >= 5) prep.push("🧴 UV yüksek: güneş kremi ve gözlük.");
      if (tmax >= 28) prep.push("💧 Sıcak; yanına su al.");
      if (sunset <= "17:30") prep.push(`🚲 Erken kararıyor (gün batımı ${sunset}); bisikletle döneceksen ışıklarını kontrol et.`);

      return `<h2>${di === 0 ? emo + " Bugün" : "🌙 Yarın"}</h2>
        <p>${text}</p>
        <div class="prep-title">Hazırlık</div>
        <ul>${prep.map((x) => `<li>${x}</li>`).join("")}</ul>`;
    }

    function renderWeather(w) {
      const c = w.current, d = w.daily, h = w.hourly;
      const today = d.time[0];
      const tmin = r0(d.temperature_2m_min[0]), tmax = r0(d.temperature_2m_max[0]);

      // Şu andan itibaren 24 saat
      const nowHour = c.time.slice(0, 13);
      let start = h.time.findIndex((t) => t.slice(0, 13) === nowHour);
      if (start < 0) start = 0;
      const hours = [];
      for (let i = start; i < Math.min(start + 24, h.time.length); i++) hours.push(i);

      $("wxBrief").innerHTML = buildBrief(w);
      $("wxBrief").hidden = false;

      const [desc] = wmo(c.weather_code);
      const hm = (iso) => iso.slice(11, 16);
      let html = `
        <div class="meta">Münih · şimdi</div>
        <div class="wx-now">
          <div>
            <div class="big">${r0(c.temperature_2m)}°</div>
            <div class="desc">${desc}</div>
            <div class="wx-sub">Hissedilen ${r0(c.apparent_temperature)}° · En düşük ${tmin}° · En yüksek ${tmax}°</div>
            <div class="wx-sub">💨 ${r0(c.wind_speed_10m)} km/s · 💧 %${r0(c.relative_humidity_2m)} · 🌅 ${hm(d.sunrise[0])} · 🌇 ${hm(d.sunset[0])}</div>
          </div>
          <div class="icon">${icon(c.weather_code, c.is_day)}</div>
        </div>`;

      html += `<div class="wx-h">Saatlik</div><div class="wx-hours">` + hours.map((i, k) => {
        const p = h.precipitation_probability[i] ?? 0;
        return `<div class="wx-hour">
          <div class="t">${k === 0 ? "Şimdi" : h.time[i].slice(11, 13)}</div>
          <div class="e">${icon(h.weather_code[i], h.is_day[i])}</div>
          <div>${r0(h.temperature_2m[i])}°</div>
          <div class="r">${p >= 20 ? "%" + p : ""}</div>
        </div>`;
      }).join("") + `</div>`;

      html += `<div class="wx-h">7 gün</div><ul class="wx-days">` + d.time.map((t, i) => {
        const day = i === 0 ? "Bugün" : i === 1 ? "Yarın" : GUN[new Date(t + "T12:00:00").getDay()];
        const p = d.precipitation_probability_max[i] ?? 0;
        return `<li>
          <span>${day}</span>
          <span>${wmo(d.weather_code[i])[1]}</span>
          <span class="r">${p >= 20 ? "☔ %" + p : ""}</span>
          <span class="mm"><span>${r0(d.temperature_2m_min[i])}°</span> / ${r0(d.temperature_2m_max[i])}°</span>
        </li>`;
      }).join("") + `</ul>`;

      html += `<div class="wx-sub" style="margin:14px 0 6px">Güncellendi ${new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })} · Kaynak: Open-Meteo</div>`;
      $("wx").innerHTML = html;
    }

    // ---------- Ulaşım (MVG, canlı) ----------
    // Yerler ve rotalar. Yeni bir yer eklemek: places'e ekle, routes'a "nereden-nereye" rotalarını yaz.
    const TRANSIT = {
      places: {
        home: { label: "Ev", icon: "🏠", station: "de:09162:740", stop: "Milbertshofen", walk: 6, leaveText: "Evden çıkış", arriveText: "Eve varış" },
        uni:  { label: "Üni", icon: "🎓", station: "de:09162:70", stop: "Universität", walk: 0 },
        gym:  { label: "Spor", icon: "🏋️", station: "de:09162:80", stop: "Giselastraße", walk: 4, leaveText: "Salondan çıkış", arriveText: "Salona varış" },
      },
      transfer: { station: "de:09162:400", stop: "Scheidplatz" },
      transferToleranceMin: 1,          // Scheidplatz'ta U2 ve U3 birbirini bekliyor: 1 dk fark bile yetiyor
      watchLines: ["U2", "U3", "U6"],   // aksaklık takibi
      // Bacak: [hatlar, yön (H = güney, R = kuzey), nereden, nereye, bu durakta biten seferler (oraya ulaşmaz), tahmini dk]
      routes: {
        "home-uni": [[["U2"], "H", "home", "transfer", [], 2], [["U3"], "H", "transfer", "uni", ["Bonner Platz", "Münchner Freiheit"], 7]],
        "uni-home": [[["U3"], "R", "uni", "transfer", ["Giselastraße", "Münchner Freiheit", "Bonner Platz"], 7], [["U2"], "R", "transfer", "home", ["Scheidplatz"], 2]],
        "home-gym": [[["U2"], "H", "home", "transfer", [], 2], [["U3"], "H", "transfer", "gym", ["Bonner Platz", "Münchner Freiheit"], 6]],
        "gym-home": [[["U3"], "R", "gym", "transfer", ["Münchner Freiheit", "Bonner Platz"], 6], [["U2"], "R", "transfer", "home", ["Scheidplatz"], 2]],
        "uni-gym":  [[["U3", "U6"], "R", "uni", "gym", [], 2]],
        "gym-uni":  [[["U3", "U6"], "H", "gym", "uni", [], 2]],
      },
    };
    let tFrom = new Date().getHours() < 13 ? "home" : "uni";
    let tTo = new Date().getHours() < 13 ? "uni" : "home";
    let transitTimer = null;
    const MIN = 60 * 1000;
    const depT = (d) => d.realtimeDepartureTime ?? d.plannedDepartureTime;
    const dirOf = (d) => (d.lineId || "").split(":")[3] || "";
    const hhmm = (ms) => new Date(ms).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
    const esc = (x) => String(x ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const stationOf = (k) => (k === "transfer" ? TRANSIT.transfer.station : TRANSIT.places[k].station);
    const stopOf = (k) => (k === "transfer" ? TRANSIT.transfer.stop : TRANSIT.places[k].stop);
    const legsOf = (key) => TRANSIT.routes[key].map(([lines, dir, from, to, notEndingAt, fallbackMin]) => ({ lines, dir, from, to, notEndingAt, fallbackMin }));

    function findConnections(key, data, now) {
      const legs = legsOf(key);
      const fits = (d, leg) => leg.lines.includes(d.label) && dirOf(d) === leg.dir && !leg.notEndingAt.includes(d.destination);
      const sameTrip = (list, d) => (list || []).find((x) => x.label === d.label && dirOf(x) === dirOf(d) && x.tripCode === d.tripCode && depT(x) >= depT(d));
      const arrival = (leg, d) => {
        const at = sameTrip(data[stationOf(leg.to)], d);
        return { t: at ? depT(at) : depT(d) + leg.fallbackMin * MIN, est: !at };
      };
      const [L1, L2] = legs;
      const first = (data[stationOf(L1.from)] || []).filter((d) => fits(d, L1) && depT(d) >= now - 30 * 1000).sort((a, b) => depT(a) - depT(b));
      const second = L2 ? (data[stationOf(L2.from)] || []).filter((d) => fits(d, L2) && !d.cancelled).sort((a, b) => depT(a) - depT(b)) : [];
      const out = new Map();
      for (const d1 of first) {
        if (d1.cancelled) continue;
        const a1 = arrival(L1, d1);
        if (!L2) { out.set(d1.label + d1.tripCode, { steps: [{ d: d1, leg: L1, arr: a1.t }], arr: a1.t, est: a1.est }); continue; }
        const d2 = second.find((x) => depT(x) >= a1.t - TRANSIT.transferToleranceMin * MIN);
        if (!d2) continue;
        const a2 = arrival(L2, d2);
        // Aynı aktarma trenine yetişen birden fazla tren varsa en geç çıkılanı göster
        out.set(d2.label + d2.tripCode, { steps: [{ d: d1, leg: L1, arr: a1.t }, { d: d2, leg: L2, arr: a2.t }], arr: a2.t, est: a1.est || a2.est });
      }
      const list = [...out.values()].sort((a, b) => depT(a.steps[0].d) - depT(b.steps[0].d)).slice(0, 4);
      const cancelled = first.filter((d) => d.cancelled).slice(0, 3);
      return { list, cancelled };
    }

    function delayTag(d) {
      if (d.cancelled) return '<span class="late">iptal</span>';
      if (!d.realtime) return "";
      const m = d.delayInMinutes || 0;
      return m > 0 ? `<span class="late">+${m} dk</span>` : '<span class="ontime">zamanında</span>';
    }

    function renderConnections(res, now) {
      const from = TRANSIT.places[tFrom], to = TRANSIT.places[tTo];
      if (!res.list.length) {
        $("conns").innerHTML = '<div class="empty">Önümüzdeki dakikalarda uygun bağlantı bulunamadı.</div>';
        return;
      }
      let html = res.list.map(({ steps, arr, est }) => {
        const d1 = steps[0].d;
        const leave = depT(d1) - (from.walk || 0) * MIN;
        const inMin = Math.round((leave - now) / MIN);
        const walk = from.walk || 0;
        const countdown = inMin < 0 ? (walk ? "yürüyerek yetişilmez" : "şimdi")
          : inMin === 0 ? (walk ? "hemen çık" : "şimdi")
          : walk ? `${inMin} dk sonra çık` : `${inMin} dk sonra`;
        const tilde = est ? "~" : "";
        let legs = "";
        if (walk) legs += `<div class="walk">🚶 ${from.leaveText}: ${hhmm(leave)} (${walk} dk yürüme)</div>`;
        if (steps.length === 1) {
          const s = steps[0];
          legs += `<div class="leg"><span class="line ${esc(s.d.label)}">${esc(s.d.label)}</span> ${hhmm(depT(s.d))} ${stopOf(s.leg.from)} → ${tilde}${hhmm(s.arr)} ${stopOf(s.leg.to)} ${delayTag(s.d)}</div>`;
        } else {
          const [s1, s2] = steps;
          const wait = Math.max(0, Math.round((depT(s2.d) - s1.arr) / MIN));
          const xfer = wait <= 1 ? "hemen aktarma (trenler bekleşiyor)" : `${wait} dk bekleme`;
          legs += `<div class="leg"><span class="line ${esc(s1.d.label)}">${esc(s1.d.label)}</span> ${hhmm(depT(s1.d))} ${stopOf(s1.leg.from)} ${delayTag(s1.d)}</div>
            <div class="xfer">↓ ${stopOf(s1.leg.to)} · ${xfer}</div>
            <div class="leg"><span class="line ${esc(s2.d.label)}">${esc(s2.d.label)}</span> ${hhmm(depT(s2.d))} → ${tilde}${hhmm(s2.arr)} ${stopOf(s2.leg.to)} ${delayTag(s2.d)}</div>`;
        }
        if (to.walk) legs += `<div class="walk">${to.icon} ${to.arriveText}: ~${hhmm(arr + to.walk * MIN)}</div>`;
        return `<div class="conn">
          <div class="conn-top">
            <span class="times">${hhmm(depT(d1))} → ${tilde}${hhmm(arr)}</span>
            <span class="dur">${Math.round((arr - depT(d1)) / MIN)} dk</span>
            <span class="in">${countdown}</span>
          </div>
          <div class="legs">${legs}</div>
        </div>`;
      }).join("");
      if (res.cancelled.length) {
        html += `<p class="est" style="margin:10px 0 0">İptal edilen seferler: ${res.cancelled.map((d) => `${esc(d.label)} ${hhmm(d.plannedDepartureTime)}`).join(", ")}</p>`;
      }
      html += `<p class="est" style="margin:12px 0 4px">Güncellendi ${hhmm(now)} · <button class="refresh" type="button" id="transitRefresh">Yenile</button></p>`;
      $("conns").innerHTML = html;
      $("transitRefresh").addEventListener("click", loadTransit);
    }

    function renderStatus(messages, lines) {
      const box = $("transitStatus");
      box.hidden = false;
      const now = Date.now();
      const active = (messages || []).filter((m) => {
        if (!(m.lines || []).some((l) => lines.includes(l.label))) return false;
        const spans = m.incidentDurations?.length ? m.incidentDurations : [{ from: m.validFrom, to: m.validTo }];
        return spans.some((s) => (s.from ?? 0) <= now + 24 * 60 * MIN && (s.to ?? 9e15) >= now);
      });
      const title = `<h3>🚇 ${lines.join(" / ")} durumu</h3>`;
      if (!active.length) { box.innerHTML = title + '<div class="ok">✅ Bilinen aksaklık yok.</div>'; return; }
      box.innerHTML = title + active.map((m) => {
        const ls = [...new Set((m.lines || []).map((l) => l.label).filter((l) => lines.includes(l)))].join("/");
        const icon = m.type === "INCIDENT" ? "⚠️" : "🚧";
        const until = m.validTo ? "bitiş " + new Date(m.validTo).toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" }) : "";
        const body = DOMPurify.sanitize(m.description || "", { ALLOWED_TAGS: ["br", "p", "ul", "li", "b", "strong", "em"] });
        return `<details><summary>${icon} ${esc(ls)}: ${esc(m.title)}</summary><div class="msg-body">${body}<div class="est">${until}</div></div></details>`;
      }).join("");
    }

    async function mvgCall(body) {
      const { data, error } = await sb.functions.invoke("mvg", {
        body,
        headers: { apikey: CFG.SUPABASE_PUBLISHABLE_KEY },
      });
      if (error) throw error;
      return data;
    }

    function renderPicker() {
      const P = TRANSIT.places;
      const row = (kind, sel) => Object.entries(P).map(([k, p]) =>
        `<button type="button" data-${kind}="${k}" aria-pressed="${k === sel}">${p.icon} ${p.label}</button>`).join("");
      $("picker").innerHTML = `<div class="pick-row"><span>Nereden</span><div class="seg3">${row("from", tFrom)}</div></div>
        <div class="pick-row"><span>Nereye</span><div class="seg3">${row("to", tTo)}</div></div>`;
      for (const b of $("picker").querySelectorAll("button")) {
        b.addEventListener("click", () => {
          const prevFrom = tFrom, prevTo = tTo;
          if (b.dataset.from) { tFrom = b.dataset.from; if (tFrom === tTo) tTo = prevFrom; }
          if (b.dataset.to) { tTo = b.dataset.to; if (tTo === tFrom) tFrom = prevTo; }
          renderPicker();
          $("conns").innerHTML = '<div class="empty">Yükleniyor…</div>';
          loadTransit();
        });
      }
    }

    async function fetchTransit(from, to) {
      const key = `${from}-${to}`;
      const legs = legsOf(key);
      const ids = [...new Set(legs.flatMap((l) => [stationOf(l.from), stationOf(l.to)]))];
      const lines = [...new Set(legs.flatMap((l) => l.lines))].sort();
      const [deps, msgs] = await Promise.all([
        mvgCall({ action: "departures", stations: ids }),
        mvgCall({ action: "messages", lines: TRANSIT.watchLines }).catch(() => null),
      ]);
      const now = Date.now();
      return { key, lines, msgs, now, res: findConnections(key, deps, now) };
    }

    async function loadTransit() {
      clearTimeout(transitTimer);
      renderPicker();
      try {
        const t = await fetchTransit(tFrom, tTo);
        renderConnections(t.res, t.now);
        if (t.msgs) renderStatus(t.msgs, t.lines);
      } catch (err) {
        $("conns").innerHTML = `<div class="empty">Ulaşım verisi alınamadı.<br><small>${esc(err.message || err)}</small></div>`;
      }
      // Sekme açıkken 30 saniyede bir yenile
      transitTimer = setTimeout(() => { if (currentTab === "ulasim" && !document.hidden) loadTransit(); }, 30 * 1000);
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden && currentTab === "ulasim") loadTransit(); });

    // ---------- Gym programı (Supabase'de saklanır) ----------
    const WD = ["", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
    const WDS = ["", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];
    const gym = {
      days: [], exercises: [], sessions: [], logs: [], tracking: true, goal: 3,
      selected: null, editing: false, draft: null, confirmDelete: false, busy: false, openHistory: new Set(), openEx: null,
    };
    const todayWd = () => { const d = new Date().getDay(); return d === 0 ? 7 : d; };
    const sortDays = (a, b) => (a.weekday ?? 99) - (b.weekday ?? 99) || a.position - b.position || a.id - b.id;
    const H12 = 12 * 60 * 60 * 1000;
    const norm = (n) => (n || "").trim().toLocaleLowerCase("tr-TR");
    const num = (v) => { const x = parseFloat(String(v ?? "").replace(",", ".")); return Number.isFinite(x) ? x : null; };
    const fmtKg = (w) => (w == null ? "–" : String(+w).replace(".", ","));
    const dshort = (iso) => new Date(iso).toLocaleDateString("tr-TR", { day: "numeric", month: "short", timeZone: "Europe/Berlin" });
    const daysAgo = (iso) => {
      const day = (t) => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Berlin" }).format(t);
      const n = Math.round((new Date(day(new Date())) - new Date(day(new Date(iso)))) / 86400000);
      return n <= 0 ? "bugün" : n === 1 ? "dün" : `${n} gün önce`;
    };

    // Devam eden (12 saatten yeni, tamamlanmamış) antrenman
    const activeSession = (dayId) => gym.sessions.find((s) => !s.completed_at && Date.now() - new Date(s.started_at) < H12 && (dayId == null || s.day_id === dayId));
    const lastCompleted = () => gym.sessions.find((s) => s.completed_at);
    const byPosition = () => [...gym.days].sort((a, b) => a.position - b.position || a.id - b.id);
    function nextDay() {
      const last = lastCompleted();
      const order = byPosition();
      if (!last || !order.length) return order[0] || null;
      const i = order.findIndex((d) => d.id === last.day_id);
      return i < 0 ? order[0] : order[(i + 1) % order.length];
    }
    // Bir egzersizin bu antrenman dışındaki geçmişi (en yeni önce), egzersiz adına göre
    function historyFor(name, excludeSessionId, limit = 5) {
      const key = norm(name);
      const bySession = new Map();
      for (const l of gym.logs) {
        if (norm(l.exercise_name) !== key || l.session_id === excludeSessionId) continue;
        if (!bySession.has(l.session_id)) bySession.set(l.session_id, []);
        bySession.get(l.session_id).push(l);
      }
      return gym.sessions
        .filter((s) => bySession.has(s.id))
        .slice(0, limit)
        .map((s) => ({ date: s.completed_at || s.started_at, sets: bySession.get(s.id).sort((a, b) => a.set_no - b.set_no) }));
    }
    const setsText = (sets) => sets.map((l) => (l.weight_kg != null ? `${fmtKg(l.weight_kg)}×${l.reps ?? "?"}` : `${l.reps ?? "✓"}`)).join(" · ");

    async function fetchGym() {
      const [d, e, s, l, g] = await Promise.all([
        sb.from("gym_days").select("*"),
        sb.from("gym_exercises").select("*").order("position").order("id"),
        sb.from("gym_sessions").select("*").order("started_at", { ascending: false }).limit(300),
        sb.from("gym_set_logs").select("*").order("created_at", { ascending: false }).limit(5000),
        sb.from("gym_settings").select("weekly_goal").maybeSingle(),
      ]);
      if (d.error || e.error) throw d.error || e.error;
      gym.days = d.data.sort(sortDays);
      gym.exercises = e.data;
      gym.tracking = !s.error && !l.error;   // takip tabloları kurulmadıysa sadece program gösterilir
      gym.sessions = s.data || [];
      gym.logs = l.data || [];
      if (!g.error && g.data?.weekly_goal) gym.goal = g.data.weekly_goal;
      if (!gym.days.some((x) => x.id === gym.selected)) {
        const running = activeSession();
        gym.selected = running?.day_id ?? gym.days.find((x) => x.weekday === todayWd())?.id ?? nextDay()?.id ?? gym.days[0]?.id ?? null;
      }
    }
    async function loadGym() {
      try {
        await fetchGym();
        renderGym();
      } catch (err) {
        $("gymDays").innerHTML = "";
        $("gymCard").innerHTML = `<div class="empty">Gym programı yüklenemedi.<br><small>${esc(err.message || err)}</small></div>`;
      }
    }

    function renderGymInfo() {
      const box = $("gymInfo");
      const last = lastCompleted(), next = nextDay();
      if (!gym.tracking || gym.editing || (!last && !next)) { box.hidden = true; return; }
      box.hidden = false;
      box.innerHTML = last
        ? `🕒 Son antrenman: <b>${esc(last.day_name)}</b> · ${daysAgo(last.completed_at)} (${dshort(last.completed_at)})${next ? `<br>➡️ Sıradaki: <b>${esc(next.name)}</b>` : ""}`
        : `➡️ İlk antrenman: <b>${esc(next.name)}</b>`;
    }

    function renderGym() {
      const nav = $("gymDays");
      nav.innerHTML = "";
      for (const d of gym.days) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "day";
        b.textContent = (d.weekday ? WDS[d.weekday] + " · " : "") + d.name + (activeSession(d.id) ? " ⏱️" : "");
        b.setAttribute("aria-pressed", String(!gym.editing && d.id === gym.selected));
        b.disabled = gym.editing;
        b.addEventListener("click", () => { gym.selected = d.id; renderGym(); });
        nav.appendChild(b);
      }
      const add = document.createElement("button");
      add.type = "button";
      add.className = "day add";
      add.textContent = "+ Gün ekle";
      add.disabled = gym.editing;
      add.addEventListener("click", () => startEdit(null));
      nav.appendChild(add);
      renderGymInfo();
      const gst = gym.tracking ? gymStats() : null;
      renderGymStats(gst);
      renderGymBadges(gst);

      if (gym.editing) return renderGymEdit();
      const day = gym.days.find((x) => x.id === gym.selected);
      if (!day) {
        $("gymCard").innerHTML = '<div class="empty">Henüz program yok.<br>“+ Gün ekle” ile ilk gününü oluştur.</div>';
        return;
      }
      const exs = gym.exercises.filter((x) => x.day_id === day.id);
      const session = gym.tracking ? activeSession(day.id) : null;
      const sessionLogs = session ? gym.logs.filter((l) => l.session_id === session.id) : [];
      const logOf = (x, n) => sessionLogs.find((l) => norm(l.exercise_name) === norm(x.name) && l.set_no === n);
      const totalSets = exs.reduce((a, x) => a + (x.sets ?? 1), 0);
      const doneToday = gym.sessions.find((s) => s.day_id === day.id && s.completed_at && Date.now() - new Date(s.completed_at) < H12);
      const target = (x) => [x.sets ? `${x.sets} × ${x.reps || "?"}` : x.reps || "", x.weight || ""].filter(Boolean).join(" · ");
      const firstNum = (t) => (String(t || "").match(/\d+/) || [""])[0];

      let status = "";
      if (session) status = `<div class="gym-status">⏱️ Antrenman sürüyor · başlangıç ${hhmm(new Date(session.started_at).getTime())} · ${sessionLogs.length}/${totalSets} set</div>`;
      else if (doneToday) status = `<div class="gym-status ok">✅ Bugün tamamlandı (${hhmm(new Date(doneToday.completed_at).getTime())}). Yeni bir sete dokunursan yeni antrenman başlar.</div>`;

      const doneCount = (x) => Array.from({ length: x.sets ?? 1 }, (_, i) => logOf(x, i + 1)).filter(Boolean).length;
      const exHtml = exs.map((x, idx) => {
        const cardio = x.sets == null, total = x.sets ?? 1, done = doneCount(x), complete = gym.tracking && done === total;
        const isOpen = gym.openEx === x.id;
        const hist = gym.tracking ? historyFor(x.name, session?.id) : [];
        const prev = hist[0];
        const rows = Array.from({ length: total }, (_, i) => {
          const n = i + 1, log = logOf(x, n), p = prev?.sets.find((s) => s.set_no === n) || prev?.sets[prev.sets.length - 1];
          const phW = p?.weight_kg != null ? fmtKg(p.weight_kg) : "–";
          const phR = p?.reps ?? (firstNum(x.reps) || "–");
          return `<div class="set${log ? " done" : ""}${cardio ? " cardio-row" : ""}" data-ex="${x.id}" data-set="${n}">
            <span class="sn${log && gst?.prIds.has(log.id) ? " pr" : ""}" title="${log && gst?.prIds.has(log.id) ? "Kişisel rekor" : ""}">${cardio ? "" : log && gst?.prIds.has(log.id) ? "🏆" : `Set ${n}`}</span>
            ${cardio ? `<span class="cardio">${esc(x.reps || "Yapıldı")}</span>` : `
              <input class="kg" inputmode="decimal" placeholder="${esc(phW)}" value="${log?.weight_kg != null ? fmtKg(log.weight_kg) : ""}" aria-label="Set ${n} ağırlık (kg)">
              <span class="x">kg</span>
              <input class="rp" inputmode="numeric" placeholder="${esc(phR)}" value="${log?.reps ?? ""}" aria-label="Set ${n} tekrar">
              <span class="x">tekrar</span>`}
            <button type="button" class="chk" aria-label="Set ${n} tamam" aria-pressed="${!!log}">✓</button>
          </div>`;
        }).join("");
        const histOpen = gym.openHistory.has(norm(x.name));
        const badge = complete ? "✓" : String(idx + 1);
        const progress = !gym.tracking ? "" : complete ? '<span class="ex-prog ok">Tamamlandı</span>' : done ? `<span class="ex-prog">${done}/${total}</span>` : "";
        return `<li class="ex${complete ? " complete" : ""}${isOpen ? " open" : ""}">
          <button type="button" class="ex-head" data-open="${x.id}" aria-expanded="${isOpen}">
            <span class="badge">${badge}</span>
            <span class="ex-name">${esc(x.name)}</span>
            ${progress}
            <span class="chev">${isOpen ? "▴" : "▾"}</span>
          </button>
          ${isOpen ? `<div class="ex-body">
            <div class="ex-target">Hedef: ${esc(target(x)) || "–"}</div>
            ${x.note ? `<div class="ex-note">📝 ${esc(x.note)}</div>` : ""}
            ${gym.tracking ? `<div class="sets">${rows}</div>` : ""}
            ${prev ? `<button type="button" class="prev" data-hist="${esc(norm(x.name))}">Geçen (${dshort(prev.date)}): ${esc(setsText(prev.sets))} ${hist.length > 1 ? (histOpen ? "▴" : "▾") : ""}</button>` : ""}
            ${histOpen && hist.length > 1 ? `<div class="hist">${hist.slice(1).map((h) => `<div>${dshort(h.date)}: ${esc(setsText(h.sets))}</div>`).join("")}</div>` : ""}
          </div>` : ""}
        </li>`;
      }).join("");

      $("gymCard").innerHTML = `
        <div class="gym-head">
          <div>
            <div class="meta">${day.weekday ? WD[day.weekday] + (day.weekday === todayWd() ? " · bugün" : "") + " · " : ""}${exs.length} egzersiz</div>
            <h1>${esc(day.name)}</h1>
            ${day.description ? `<div class="wx-sub" style="margin-top:0">${esc(day.description)}</div>` : ""}
          </div>
          <button class="btn-ghost" type="button" id="gymEditBtn">Düzenle</button>
        </div>
        ${status}
        ${exs.length ? `<ol class="ex-list">${exHtml}</ol>` : '<div class="empty" style="padding:28px 8px">Bu gün için egzersiz yok.<br>Dinlenme günü mü? 🙂</div>'}
        ${gym.tracking && exs.length ? (session
          ? `<button class="btn" type="button" id="gymFinish" style="width:100%;margin:6px 0 4px">✅ Antrenmanı tamamla (${sessionLogs.length}/${totalSets} set)</button>
             <button class="btn-ghost danger" type="button" id="gymDiscard" style="width:100%;margin-top:6px">${gym.confirmDelete ? "Emin misin? Bu antrenmanın setleri silinecek" : "Antrenmanı iptal et"}</button>`
          : '<p class="est" style="text-align:center;margin:8px 0 4px">Setleri yaptıkça ✓\'ye dokun. Boş bıraktığın kutularda geçen seferki değerler kullanılır.</p>') : ""}
        ${gym.tracking ? "" : '<p class="est" style="margin-top:10px">Set takibi için Supabase\'de gym_takip.sql dosyasını çalıştır.</p>'}
        <p class="error" id="gymErr"></p>`;

      $("gymEditBtn").addEventListener("click", () => startEdit(day.id));
      const card = $("gymCard");
      card.querySelectorAll(".set .chk").forEach((b) => b.addEventListener("click", () => toggleSet(day, b.closest(".set"))));
      card.querySelectorAll(".set input").forEach((inp) => inp.addEventListener("change", () => updateSetValues(inp.closest(".set"))));
      card.querySelectorAll(".ex-head").forEach((b) => b.addEventListener("click", () => {
        const id = +b.dataset.open;
        gym.openEx = gym.openEx === id ? null : id;
        renderGym();
      }));
      card.querySelectorAll(".prev").forEach((b) => b.addEventListener("click", () => {
        const k = b.dataset.hist;
        gym.openHistory.has(k) ? gym.openHistory.delete(k) : gym.openHistory.add(k);
        renderGym();
      }));
      $("gymFinish")?.addEventListener("click", () => finishSession(session, sessionLogs));
      $("gymDiscard")?.addEventListener("click", () => discardSession(session));
    }

    function readSet(row, ex) {
      const kg = row.querySelector(".kg"), rp = row.querySelector(".rp");
      if (!kg) return { weight_kg: null, reps: null };   // kardiyo/yürüyüş: sadece işaret
      return {
        weight_kg: num(kg.value) ?? num(kg.placeholder),
        reps: num(rp.value) != null ? Math.round(num(rp.value)) : (num(rp.placeholder) != null ? Math.round(num(rp.placeholder)) : null),
      };
    }

    async function toggleSet(day, row) {
      if (gym.busy) return;
      const ex = gym.exercises.find((x) => x.id === +row.dataset.ex);
      const setNo = +row.dataset.set;
      gym.busy = true;
      try {
        let session = activeSession(day.id);
        const existing = session && gym.logs.find((l) => l.session_id === session.id && norm(l.exercise_name) === norm(ex.name) && l.set_no === setNo);
        if (existing) {
          const { error } = await sb.from("gym_set_logs").delete().eq("id", existing.id);
          if (error) throw error;
          gym.logs = gym.logs.filter((l) => l.id !== existing.id);
        } else {
          if (!session) {
            const { data, error } = await sb.from("gym_sessions").insert({ day_id: day.id, day_name: day.name }).select("*").single();
            if (error) throw error;
            session = data;
            gym.sessions.unshift(session);
            gym.confirmDelete = false;
          }
          const { data, error } = await sb.from("gym_set_logs")
            .upsert({ session_id: session.id, exercise_id: ex.id, exercise_name: ex.name, set_no: setNo, ...readSet(row, ex) }, { onConflict: "session_id,exercise_name,set_no" })
            .select("*").single();
          if (error) throw error;
          gym.logs = [data, ...gym.logs.filter((l) => l.id !== data.id)];
          if (gymStats().prIds.has(data.id)) toast(`🏆 Yeni rekor! ${ex.name} · ${fmtKg(data.weight_kg)} kg`);
          const doneSets = new Set(gym.logs.filter((l) => l.session_id === session.id).map((l) => norm(l.exercise_name) + "#" + l.set_no));
          const finished = (x) => Array.from({ length: x.sets ?? 1 }, (_, i) => doneSets.has(norm(x.name) + "#" + (i + 1))).every(Boolean);
          if (finished(ex)) {
            const list = gym.exercises.filter((x) => x.day_id === day.id);
            const i = list.findIndex((x) => x.id === ex.id);
            const next = [...list.slice(i + 1), ...list.slice(0, i)].find((x) => !finished(x));
            gym.openEx = next ? next.id : null;
          }
        }
        renderGym();
      } catch (err) {
        $("gymErr").textContent = "Kaydedilemedi: " + (err.message || err);
      } finally {
        gym.busy = false;
      }
    }

    // İşaretli bir setin kg/tekrarı değiştirilirse kaydı güncelle
    async function updateSetValues(row) {
      const day = gym.days.find((x) => x.id === gym.selected);
      const session = day && activeSession(day.id);
      if (!session) return;
      const ex = gym.exercises.find((x) => x.id === +row.dataset.ex);
