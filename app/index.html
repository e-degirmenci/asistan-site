      const log = gym.logs.find((l) => l.session_id === session.id && norm(l.exercise_name) === norm(ex.name) && l.set_no === +row.dataset.set);
      if (!log) return;
      const vals = readSet(row, ex);
      const { error } = await sb.from("gym_set_logs").update(vals).eq("id", log.id);
      if (error) { $("gymErr").textContent = "Güncellenemedi: " + error.message; return; }
      Object.assign(log, vals);
    }

    async function finishSession(session, sessionLogs) {
      if (gym.busy) return;
      gym.busy = true;
      const { error } = await sb.from("gym_sessions").update({ completed_at: new Date().toISOString() }).eq("id", session.id);
      gym.busy = false;
      if (error) { $("gymErr").textContent = "Tamamlanamadı: " + error.message; return; }
      const volume = sessionLogs.reduce((a, l) => a + (l.weight_kg || 0) * (l.reps || 0), 0);
      await loadGym();
      const st = gymStats(), ps = st.perSession.get(session.id) || { xp: 0, prs: 0 };
      const levelBefore = levelOf(st.xp - ps.xp).L;
      const banner = document.createElement("div");
      banner.className = "gym-status ok";
      banner.innerHTML = `🎉 Tebrikler! <b>+${ps.xp} XP</b> · ${sessionLogs.length} set${volume ? ` · ${Math.round(volume).toLocaleString("tr-TR")} kg hacim` : ""}${ps.prs ? ` · 🏆 ${ps.prs} rekor` : ""}`
        + (st.lvl.L > levelBefore ? `<br>⬆️ Seviye atladın: <b>Seviye ${st.lvl.L} · ${st.lvl.title}</b>` : "")
        + (st.thisCount === st.goal ? `<br>🔥 Haftalık hedef tamam!${st.streak > 1 ? ` Seri: ${st.streak} hafta` : ""}` : "");
      $("gymCard").prepend(banner);
    }

    async function discardSession(session) {
      if (!gym.confirmDelete) { gym.confirmDelete = true; renderGym(); return; }
      gym.confirmDelete = false;
      const { error } = await sb.from("gym_sessions").delete().eq("id", session.id);
      if (error) { $("gymErr").textContent = "İptal edilemedi: " + error.message; return; }
      await loadGym();
    }

    function startEdit(dayId) {
      const day = gym.days.find((x) => x.id === dayId);
      gym.draft = day
        ? { id: day.id, name: day.name, description: day.description || "", weekday: day.weekday, exercises: gym.exercises.filter((x) => x.day_id === day.id).map((x) => ({ ...x })) }
        : { id: null, name: "", description: "", weekday: null, exercises: [{ name: "", sets: null, reps: "", weight: "", note: "" }] };
      gym.editing = true;
      gym.confirmDelete = false;
      renderGym();
    }

    function renderGymEdit() {
      const d = gym.draft;
      const opt = (v, label) => `<option value="${v}" ${String(d.weekday ?? "") === String(v) ? "selected" : ""}>${label}</option>`;
      $("gymCard").innerHTML = `
        <div class="gym-edit">
          <div class="meta">${d.id ? "Günü düzenle" : "Yeni gün"}</div>
          <label for="gName">Gün adı</label>
          <input id="gName" data-f="name" placeholder="ör. Push, Bacak, Üst vücut" value="${esc(d.name)}">
          <label for="gDesc">Açıklama (opsiyonel)</label>
          <input id="gDesc" data-f="description" placeholder="ör. Göğüs, omuz ve triceps" value="${esc(d.description)}">
          <label for="gWd">Haftanın günü</label>
          <select id="gWd" data-f="weekday">${opt("", "— Atanmamış —")}${WD.slice(1).map((w, i) => opt(i + 1, w)).join("")}</select>
          <label>Egzersizler</label>
          ${d.exercises.map((x, i) => `<div class="ex-edit">
              <input data-i="${i}" data-x="name" placeholder="Egzersiz (ör. Bench Press)" value="${esc(x.name)}">
              <div class="row3 lbls"><span>Set</span><span>Tekrar</span><span>Ağırlık</span></div>
              <div class="row3" style="margin-top:-6px">
                <input data-i="${i}" data-x="sets" inputmode="numeric" placeholder="Set" value="${esc(x.sets ?? "")}">
                <input data-i="${i}" data-x="reps" placeholder="Tekrar" value="${esc(x.reps)}">
                <input data-i="${i}" data-x="weight" placeholder="Ağırlık" value="${esc(x.weight)}">
              </div>
              <input data-i="${i}" data-x="note" placeholder="Not (opsiyonel)" value="${esc(x.note)}">
              <div class="tools">
                <button class="btn-ghost" type="button" data-move="${i}" data-dir="-1" ${i === 0 ? "disabled" : ""} aria-label="Yukarı">↑</button>
                <button class="btn-ghost" type="button" data-move="${i}" data-dir="1" ${i === d.exercises.length - 1 ? "disabled" : ""} aria-label="Aşağı">↓</button>
                <button class="btn-ghost danger" type="button" data-del="${i}">Sil</button>
              </div>
            </div>`).join("")}
          <button class="btn-ghost" type="button" id="gAddEx" style="width:100%;margin-top:10px">+ Egzersiz ekle</button>
          <div class="gym-actions">
            <button class="btn" type="button" id="gSave">Kaydet</button>
            <button class="btn-ghost" type="button" id="gCancel">Vazgeç</button>
          </div>
          ${d.id ? `<button class="btn-ghost danger" type="button" id="gDelDay" style="width:100%">${gym.confirmDelete ? "Emin misin? Silmek için tekrar dokun" : "Bu günü sil"}</button>` : ""}
          <p class="error" id="gErr"></p>
        </div>`;

      const card = $("gymCard");
      card.querySelectorAll("[data-f]").forEach((el) => el.addEventListener("input", () => {
        d[el.dataset.f] = el.dataset.f === "weekday" ? (el.value ? +el.value : null) : el.value;
      }));
      card.querySelectorAll("[data-x]").forEach((el) => el.addEventListener("input", () => {
        const ex = d.exercises[+el.dataset.i];
        ex[el.dataset.x] = el.dataset.x === "sets" ? (el.value.trim() === "" ? null : parseInt(el.value, 10) || null) : el.value;
      }));
      card.querySelectorAll("[data-move]").forEach((el) => el.addEventListener("click", () => {
        const i = +el.dataset.move, j = i + +el.dataset.dir;
        [d.exercises[i], d.exercises[j]] = [d.exercises[j], d.exercises[i]];
        renderGymEdit();
      }));
      card.querySelectorAll("[data-del]").forEach((el) => el.addEventListener("click", () => {
        d.exercises.splice(+el.dataset.del, 1);
        renderGymEdit();
      }));
      $("gAddEx").addEventListener("click", () => {
        d.exercises.push({ name: "", sets: null, reps: "", weight: "", note: "" });
        renderGymEdit();
        const inputs = card.querySelectorAll('[data-x="name"]');
        inputs[inputs.length - 1]?.focus();
      });
      $("gCancel").addEventListener("click", () => { gym.editing = false; gym.draft = null; renderGym(); });
      $("gSave").addEventListener("click", saveGymDay);
      if (d.id) $("gDelDay").addEventListener("click", async () => {
        if (!gym.confirmDelete) { gym.confirmDelete = true; renderGymEdit(); return; }
        const { error } = await sb.from("gym_days").delete().eq("id", d.id);
        if (error) { $("gErr").textContent = "Silinemedi: " + error.message; return; }
        gym.editing = false; gym.draft = null; gym.selected = null;
        await loadGym();
      });
    }

    async function saveGymDay() {
      const d = gym.draft;
      const btn = $("gSave");
      d.name = d.name.trim();
      if (!d.name) { $("gErr").textContent = "Gün adı boş olamaz."; return; }
      btn.disabled = true;
      try {
        let dayId = d.id;
        if (dayId) {
          const { error } = await sb.from("gym_days").update({ name: d.name, description: d.description.trim() || null, weekday: d.weekday }).eq("id", dayId);
          if (error) throw error;
        } else {
          const { data, error } = await sb.from("gym_days")
            .insert({ name: d.name, description: d.description.trim() || null, weekday: d.weekday, position: gym.days.length + 1 }).select("id").single();
          if (error) throw error;
          dayId = data.id;
        }
        const rows = d.exercises
          .map((x) => ({ ...x, name: (x.name || "").trim() }))
          .filter((x) => x.name)
          .map((x, i) => ({
            ...(x.id ? { id: x.id } : {}), day_id: dayId, position: i, name: x.name,
            sets: x.sets ?? null, reps: (x.reps || "").trim() || null, weight: (x.weight || "").trim() || null, note: (x.note || "").trim() || null,
          }));
        const keep = rows.filter((r) => r.id).map((r) => r.id);
        const removed = gym.exercises.filter((x) => x.day_id === dayId && !keep.includes(x.id)).map((x) => x.id);
        if (removed.length) {
          const { error } = await sb.from("gym_exercises").delete().in("id", removed);
          if (error) throw error;
        }
        const existing = rows.filter((r) => r.id), fresh = rows.filter((r) => !r.id);
        if (existing.length) { const { error } = await sb.from("gym_exercises").upsert(existing); if (error) throw error; }
        if (fresh.length) { const { error } = await sb.from("gym_exercises").insert(fresh); if (error) throw error; }
        gym.editing = false; gym.draft = null; gym.selected = dayId;
        await loadGym();
      } catch (err) {
        $("gErr").textContent = "Kaydedilemedi: " + (err.message || err);
        btn.disabled = false;
      }
    }

    // ---------- Market ve To-do listeleri (Supabase'de saklanır) ----------
    // İkisi aynı kodu kullanır; farkları sadece metinler ve tablo adı.
    const LISTS = {
      market: {
        table: "grocery_items", split: true, tick: "Alındı",
        doneTitle: "SEPETTE", clearText: "Sepeti temizle", allDone: "Hepsi sepette 🎉",
        empty: "Liste boş. Yukarıdan ekle.<br><small>Virgülle birden fazla ürün ekleyebilirsin.</small>",
      },
      todo: {
        table: "todo_items", split: false, tick: "Tamamlandı",
        doneTitle: "TAMAMLANDI", clearText: "Temizle", allDone: "Hepsi bitti 🎉",
        empty: "Yapılacak bir şey yok. Yukarıdan ekle.",
      },
    };
    const listData = { market: [], todo: [] };

    async function fetchList(key) {
      const { data, error } = await sb.from(LISTS[key].table).select("*").order("created_at").order("id");
      if (error) throw error;
      listData[key] = data;
    }

    async function loadList(key) {
      try {
        await fetchList(key);
        paintList(key);
      } catch (err) {
        $(key + "Items").innerHTML = `<div class="empty">Liste yüklenemedi.<br><small>${esc(err.message || err)}</small></div>`;
      }
    }

    function paintList(key) {
      const L = LISTS[key], items = listData[key];
      const open = items.filter((x) => !x.done);
      const done = items.filter((x) => x.done).sort((a, b) => new Date(b.done_at) - new Date(a.done_at));
      const row = (x) => `<li class="item${x.done ? " done" : ""}" data-id="${x.id}">
          <button type="button" class="tick" data-act="toggle" aria-label="${x.done ? "Geri al" : L.tick}" aria-pressed="${x.done}">✓</button>
          <span class="nm" data-act="toggle">${esc(x.name)}</span>
          <button type="button" class="del" data-act="del" aria-label="Sil">×</button>
        </li>`;
      let html = open.length
        ? `<ul class="items">${open.map(row).join("")}</ul>`
        : `<div class="empty" style="padding:28px 8px">${done.length ? L.allDone : L.empty}</div>`;
      if (done.length) {
        html += `<div class="sub-h"><span>${L.doneTitle} · ${done.length}</span><button type="button" data-act="clear">${L.clearText}</button></div>
          <ul class="items">${done.map(row).join("")}</ul>`;
      }
      const box = $(key + "Items");
      box.innerHTML = html;
      box.querySelectorAll("[data-act]").forEach((el) => el.addEventListener("click", () => {
        if (el.dataset.act === "clear") return clearDone(key);
        const id = +el.closest(".item").dataset.id;
        if (el.dataset.act === "del") delItem(key, id); else toggleItem(key, id);
      }));
    }

    const listErr = (key, msg) => { $(key + "Err").textContent = msg; };

    async function addItems(key) {
      const input = $(key + "In");
      // Market: "süt, 6 yumurta; ekmek" → 3 ürün ("1,5 lt süt" bölünmez). To-do: her zaman tek madde.
      const names = (LISTS[key].split ? input.value.split(/[;\n]|,(?!\d)/) : [input.value]).map((s) => s.trim()).filter(Boolean);
      if (!names.length) return;
      input.value = "";
      listErr(key, "");
      const fresh = [];
      for (const name of names) {
        const same = listData[key].find((x) => norm(x.name) === norm(name));
        if (same) { if (same.done) toggleItem(key, same.id); continue; }   // tamamlanmışsa listeye geri al
        if (!fresh.some((n) => norm(n) === norm(name))) fresh.push(name);
      }
      if (!fresh.length) return;
      const { data, error } = await sb.from(LISTS[key].table).insert(fresh.map((name) => ({ name }))).select("*");
      if (error) { if (!input.value) input.value = fresh.join(", "); listErr(key, "Eklenemedi: " + error.message); return; }
      listData[key].push(...data);
      paintList(key);
    }

    async function toggleItem(key, id) {
      const x = listData[key].find((i) => i.id === id);
      if (!x) return;
      const prev = { done: x.done, done_at: x.done_at };
      x.done = !x.done;
      x.done_at = x.done ? new Date().toISOString() : null;
      paintList(key);
      const { error } = await sb.from(LISTS[key].table).update({ done: x.done, done_at: x.done_at }).eq("id", id);
      if (error) { Object.assign(x, prev); paintList(key); listErr(key, "Kaydedilemedi: " + error.message); }
    }

    async function delItem(key, id) {
      const before = listData[key];
      listData[key] = before.filter((i) => i.id !== id);
      paintList(key);
      const { error } = await sb.from(LISTS[key].table).delete().eq("id", id);
      if (error) { listData[key] = before; paintList(key); listErr(key, "Silinemedi: " + error.message); }
    }

    async function clearDone(key) {
      const before = listData[key];
      listData[key] = before.filter((i) => !i.done);
      paintList(key);
      const { error } = await sb.from(LISTS[key].table).delete().eq("done", true);
      if (error) { listData[key] = before; paintList(key); listErr(key, "Temizlenemedi: " + error.message); }
    }

    for (const key of Object.keys(LISTS)) {
      $(key + "Add").addEventListener("click", () => addItems(key));
      $(key + "In").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addItems(key); } });
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden && LISTS[currentTab] && loggedIn) loadList(currentTab); });

    // ---------- Ders: haftalık program, görevler/ilerleme, sınavlar, notlar (Supabase'de saklanır) ----------
    const COLORS = ["#3b5bdb", "#e8590c", "#2f9e44", "#c2255c", "#7048e8", "#1098ad", "#f08c00", "#868e96"];
    const KINDS = ["Vorlesung", "Übung", "Tutorium", "Seminer", "Diğer"];
    const ders = { sub: "program", view: null, sure: null, busy: false, ready: false, courses: [], slots: [], tasks: [], exams: [] };
    const DAY = 86400000;

    function currentSemester() {
      const d = new Date(), y = d.getFullYear() % 100, m = d.getMonth() + 1;
      if (m >= 10) return `WiSe ${y}/${y + 1}`;
      if (m <= 3) return `WiSe ${y - 1}/${y}`;
      return `SoSe ${y}`;
    }
    function semKey(s) {
      const t = String(s || "");
      let m = t.match(/(wise|ws)\s*(\d{2})/i);
      if (m) return 2000 + +m[2] + 0.5;
      m = t.match(/(sose|ss)\s*(\d{2})/i);
      return m ? 2000 + +m[2] : 0;
    }
    const courseOf = (id) => ders.courses.find((c) => c.id === id);
    const cname = (c) => (c ? c.short || c.name : "?");
    const dot = (c) => `<span class="cdot" style="background:${esc(c?.color || COLORS[7])}"></span>`;
    const berlinDay = (t) => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Berlin" }).format(t);
    const dayDiff = (iso) => Math.round((new Date(berlinDay(new Date(iso))) - new Date(berlinDay(new Date()))) / DAY);
    const relDay = (iso) => { const n = dayDiff(iso); return n < 0 ? `${-n} gün geçti` : n === 0 ? "bugün" : n === 1 ? "yarın" : `${n} gün`; };
    const fmtDate = (iso, withTime = true) => new Date(iso).toLocaleString("tr-TR", { weekday: "short", day: "numeric", month: "short", ...(withTime ? { hour: "2-digit", minute: "2-digit" } : {}), timeZone: "Europe/Berlin" });
    const dueClass = (iso) => (new Date(iso) < new Date() ? "over" : dayDiff(iso) <= 2 ? "soon" : "");
    const fmtNum = (x) => String(+x).replace(".", ",");
    const fmtGrade = (g) => (g == null ? "" : Number(g).toFixed(1).replace(".", ","));
    const t5 = (t) => (t || "").slice(0, 5);
    const hhmmNow = () => new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
    const dateOnly = (d) => d + "T12:00:00";   // "2026-11-20" gibi tarihleri gün hesabına sokmak için
    // Tarih + saat kutuları telefonun saatine göre yorumlanır (telefon Münih saatinde)
    const localIso = (d, t) => new Date(`${d}T${t || "23:59"}`).toISOString();
    const isoParts = (iso) => {
      if (!iso) return ["", ""];
      const d = new Date(iso);
      return [berlinDay(d), d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" })];
    };
    const slotSort = (a, b) => a.weekday - b.weekday || (t5(a.start_time) > t5(b.start_time) ? 1 : -1);
    const dueVal = (t) => (t.due_at ? Date.parse(t.due_at) : 9e15);
    const byDue = (a, b) => dueVal(a) - dueVal(b) || a.id - b.id;
    const activeIds = () => new Set(ders.courses.filter((c) => c.status === "aktif").map((c) => c.id));
    const dersErr = (msg) => { const e = $("dersErr"); if (e) e.textContent = msg; return false; };

    async function fetchDers() {
      const [c, s, t, e] = await Promise.all([
        sb.from("courses").select("*").order("position").order("id"),
        sb.from("course_slots").select("*").order("weekday").order("start_time"),
        sb.from("course_tasks").select("*").order("created_at").order("id"),
        sb.from("exams").select("*").order("exam_at"),
      ]);
      const err = c.error || s.error || t.error || e.error;
      if (err) throw err;
      Object.assign(ders, { courses: c.data, slots: s.data, tasks: t.data, exams: e.data, ready: true });
    }

    async function loadDers() {
      if (!ders.ready) $("dersCard").innerHTML = '<div class="empty">Yükleniyor…</div>';
      try {
        await fetchDers();
      } catch (err) {
        $("dersCard").innerHTML = `<div class="empty">Ders bilgileri yüklenemedi.<br><small>${esc(err.message || err)}</small></div>`;
        return;
      }
      // Bir form açıksa ya da bir şey yazıyorsan ekranı yenileme (yazdıkların silinmesin)
      const typing = $("dersCard").contains(document.activeElement) && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
      if (!["edit", "exam"].includes(ders.view?.type) && !typing) renderDers();
    }

    for (const b of $("dersSeg").children) b.addEventListener("click", () => {
      ders.sub = b.dataset.sub;
      ders.view = null;
      ders.sure = null;
      renderDers();
    });

    function renderDers() {
      for (const b of $("dersSeg").children) b.setAttribute("aria-pressed", String(b.dataset.sub === ders.sub));
      if (!ders.ready) return;
      const v = ders.view;
      if (v?.type === "course") return renderCourse(v.id);
      if (v?.type === "edit") return renderCourseEdit();
      if (v?.type === "exam") return renderExamEdit();
      ({ program: renderProgram, dersler: renderCourses, sinav: renderExams, notlar: renderGrades })[ders.sub]();
    }

    const taskRow = (t, showCourse) => {
      const c = courseOf(t.course_id);
      const due = t.due_at ? `<span class="due ${t.done ? "" : dueClass(t.due_at)}">${fmtDate(t.due_at)} · ${relDay(t.due_at)}</span>` : "";
      return `<li class="item${t.done ? " done" : ""}">
          <button type="button" class="tick" data-act="toggle-task" data-id="${t.id}" aria-pressed="${t.done}" aria-label="${t.done ? "Geri al" : "Tamamlandı"}">✓</button>
          <span class="nm" data-act="toggle-task" data-id="${t.id}">${esc(t.title)}${showCourse ? ` <span class="est">· ${dot(c)} ${esc(cname(c))}</span>` : ""}${due ? "<br>" + due : ""}</span>
          <button type="button" class="del" data-act="del-task" data-id="${t.id}" aria-label="Sil">×</button>
        </li>`;
    };

    // --- Program ---
    function renderProgram() {
      const active = activeIds();
      const slots = ders.slots.filter((s) => active.has(s.course_id)).sort(slotSort);
      if (!slots.length) {
        $("dersCard").innerHTML = `<div class="empty" style="padding:28px 8px">Henüz ders programı yok.<br>${active.size ? "Derslerine saat eklemek için Dersler'den bir derse girip Düzenle'ye dokun." : "Bu dönem aldığın dersleri ve saatlerini ekle."}</div>
          <button class="btn" type="button" data-act="new-course" style="width:100%">+ Ders ekle</button>`;
        return;
      }
      const tw = todayWd(), nowT = hhmmNow();
      const days = [...new Set(slots.map((s) => s.weekday))];
      const order = [...days.filter((d) => d >= tw), ...days.filter((d) => d < tw)];   // bugünden başlayarak
      let nextMarked = false;
      $("dersCard").innerHTML = order.map((d) => {
        const label = d === tw ? "Bugün · " : d === (tw % 7) + 1 ? "Yarın · " : "";
        return `<div class="wk-day${d === tw ? " today" : ""}">${label}${WD[d]}</div>` + slots.filter((s) => s.weekday === d).map((s) => {
          const c = courseOf(s.course_id);
          let badge = "";
          if (d === tw) {
            if (t5(s.start_time) <= nowT && nowT < t5(s.end_time || "23:59")) badge = '<span class="badge now">şimdi</span>';
            else if (!nextMarked && t5(s.start_time) > nowT) { badge = '<span class="badge next">sıradaki</span>'; nextMarked = true; }
          }
          return `<div class="slot" data-act="open-course" data-id="${c.id}">
              <div class="tm">${t5(s.start_time)}${s.end_time ? `<span>${t5(s.end_time)}</span>` : ""}</div>
              <div class="sl-main"><div class="sl-name">${dot(c)} ${esc(c.name)}${badge}</div><div class="sl-sub">${[s.kind, s.room].filter(Boolean).map(esc).join(" · ")}</div></div>
            </div>`;
        }).join("");
      }).join("") + '<p class="est" style="margin:14px 0 0">Saatleri değiştirmek için derse dokun → Düzenle.</p>';
    }

    // --- Dersler (aktif dersler + yaklaşan teslimler) ---
    function renderCourses() {
      const active = ders.courses.filter((c) => c.status === "aktif");
      const ids = activeIds();
      const upcoming = ders.tasks.filter((t) => !t.done && t.due_at && ids.has(t.course_id)).sort(byDue).slice(0, 6);
      let html = "";
      if (upcoming.length) html += `<div class="sub-h first"><span>YAKLAŞAN TESLİMLER</span></div><ul class="items">${upcoming.map((t) => taskRow(t, true)).join("")}</ul>`;
      html += `<div class="sub-h${upcoming.length ? "" : " first"}"><span>BU DÖNEM · ${active.length} DERS</span></div>`;
      html += active.length ? active.map((c) => {
        const ts = ders.tasks.filter((t) => t.course_id === c.id), done = ts.filter((t) => t.done).length;
        const pct = ts.length ? Math.round((done / ts.length) * 100) : 0;
        const next = ts.filter((t) => !t.done && t.due_at).sort(byDue)[0];
        const sub = [c.ects ? fmtNum(c.ects) + " ECTS" : "", ts.length ? `${done}/${ts.length} görev` : "görev yok", next ? `sıradaki teslim ${relDay(next.due_at)}` : ""].filter(Boolean).join(" · ");
        return `<button type="button" class="crs" data-act="open-course" data-id="${c.id}">
            <div class="crs-top">${dot(c)}<span class="nm">${esc(c.name)}</span><span class="chev">›</span></div>
            <div class="sub">${sub}</div>
            ${ts.length ? `<div class="bar"><i style="width:${pct}%;background:${esc(c.color || COLORS[0])}"></i></div>` : ""}
          </button>`;
      }).join("") : '<div class="empty" style="padding:24px 8px">Henüz ders yok. Bu dönem aldığın dersleri ekle.</div>';
      html += `<button class="btn" type="button" data-act="new-course" style="width:100%;margin-top:14px">+ Ders ekle</button><p class="error" id="dersErr"></p>`;
      $("dersCard").innerHTML = html;
    }

    // --- Ders detayı: görevler ve ilerleme ---
    function renderCourse(id) {
      const c = courseOf(id);
      if (!c) { ders.view = null; return renderDers(); }
      const tasks = ders.tasks.filter((t) => t.course_id === id);
      const open = tasks.filter((t) => !t.done).sort(byDue);
      const done = tasks.filter((t) => t.done).sort((a, b) => new Date(b.done_at) - new Date(a.done_at));
      const slots = ders.slots.filter((s) => s.course_id === id).sort(slotSort);
      const exams = ders.exams.filter((e) => e.course_id === id && new Date(e.exam_at) > Date.now() - DAY);
      const pct = tasks.length ? Math.round((done.length / tasks.length) * 100) : 0;
      const backTo = { program: "Program", dersler: "Dersler", sinav: "Sınavlar", notlar: "Notlar" }[ders.sub];
      const status = c.status === "gecti" ? `Geçti${c.grade != null ? " · " + fmtGrade(c.grade) : ""}` : c.status === "kaldi" ? "Kaldı" : "";
      $("dersCard").innerHTML = `
        <button type="button" class="back" data-act="back">‹ ${backTo}</button>
        <div class="gym-head">
          <div><div class="meta">${[c.ects ? fmtNum(c.ects) + " ECTS" : "", c.semester, status].filter(Boolean).map(esc).join(" · ") || "Ders"}</div>
          <h1>${dot(c)} ${esc(c.name)}</h1></div>
          <button class="btn-ghost" type="button" data-act="edit-course" data-id="${id}">Düzenle</button>
        </div>
        ${slots.length ? `<div class="crs-info">${slots.map((s) => `<div>🕒 ${WDS[s.weekday]} ${t5(s.start_time)}${s.end_time ? "–" + t5(s.end_time) : ""}${s.kind ? " · " + esc(s.kind) : ""}${s.room ? " · " + esc(s.room) : ""}</div>`).join("")}</div>` : ""}
        ${exams.length ? `<div class="crs-info">${exams.map((e) => `<div>📅 Sınav: ${fmtDate(e.exam_at)} · ${relDay(e.exam_at)}</div>`).join("")}</div>` : ""}
        <div class="sub-h"><span>İLERLEME · ${done.length}/${tasks.length} GÖREV</span><span>%${pct}</span></div>
        <div class="bar wide"><i style="width:${pct}%;background:${esc(c.color || COLORS[0])}"></i></div>
        <div class="add-row" style="margin-top:14px">
          <input id="taskIn" placeholder="Görev ekle (ör. Übungsblatt 4)" autocomplete="off" enterkeyhint="done" aria-label="Görev">
          <button class="btn" type="button" data-act="add-task" aria-label="Ekle">+</button>
        </div>
        <div class="due-row"><span>Teslim (ops.)</span><input type="date" id="taskDate" aria-label="Teslim günü"><input type="time" id="taskTime" aria-label="Teslim saati"></div>
        ${open.length ? `<ul class="items">${open.map((t) => taskRow(t, false)).join("")}</ul>`
          : `<div class="empty" style="padding:20px 8px">${tasks.length ? "Hepsi bitti 🎉" : "Henüz görev yok.<br><small>Übungsblätter, tekrar edeceğin konular, okumalar…</small>"}</div>`}
        ${done.length ? `<div class="sub-h"><span>TAMAMLANDI · ${done.length}</span></div><ul class="items">${done.map((t) => taskRow(t, false)).join("")}</ul>` : ""}
        <p class="error" id="dersErr"></p>`;
      $("taskIn").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addTask(id); } });
    }

    async function addTask(courseId) {
      const title = $("taskIn").value.trim(), d = $("taskDate").value, t = $("taskTime").value;
      if (!title) { $("taskIn").focus(); return; }
      const { data, error } = await sb.from("course_tasks").insert({ course_id: courseId, title, due_at: d ? localIso(d, t) : null }).select("*").single();
      if (error) return dersErr("Eklenemedi: " + error.message);
      ders.tasks.push(data);
      renderDers();
      $("taskIn")?.focus();
    }

    async function toggleTask(id) {
      const t = ders.tasks.find((x) => x.id === id);
      if (!t) return;
      const prev = { done: t.done, done_at: t.done_at };
      t.done = !t.done;
      t.done_at = t.done ? new Date().toISOString() : null;
      renderDers();
      const { error } = await sb.from("course_tasks").update({ done: t.done, done_at: t.done_at }).eq("id", id);
      if (error) { Object.assign(t, prev); renderDers(); dersErr("Kaydedilemedi: " + error.message); }
    }

    async function delTask(id) {
      const before = ders.tasks;
      ders.tasks = before.filter((x) => x.id !== id);
      renderDers();
      const { error } = await sb.from("course_tasks").delete().eq("id", id);
      if (error) { ders.tasks = before; renderDers(); dersErr("Silinemedi: " + error.message); }
    }

    // --- Ders ekle / düzenle ---
    const opt = (v, label, sel) => `<option value="${esc(v)}"${String(sel ?? "") === String(v) ? " selected" : ""}>${esc(label)}</option>`;

    function openCourseEditor(c, status) {
      const used = new Set(ders.courses.map((x) => x.color));
      ders.view = {
        type: "edit", back: ders.view,
        draft: c
          ? { id: c.id, name: c.name, short: c.short || "", color: c.color || COLORS[0], ects: c.ects != null ? fmtNum(c.ects) : "", semester: c.semester || "", status: c.status, grade: c.grade != null ? fmtGrade(c.grade) : "",
              slots: ders.slots.filter((s) => s.course_id === c.id).sort(slotSort).map((s) => ({ ...s, start_time: t5(s.start_time), end_time: t5(s.end_time) })) }
          : { id: null, name: "", short: "", color: COLORS.find((x) => !used.has(x)) || COLORS[0], ects: "", semester: status === "gecti" ? "" : currentSemester(), status: status || "aktif", grade: "",
              slots: status === "gecti" ? [] : [{ weekday: 1, start_time: "", end_time: "", kind: "Vorlesung", room: "" }] },
      };
      ders.sure = null;
      renderDers();
      window.scrollTo(0, 0);
    }

    function renderCourseEdit() {
      const d = ders.view.draft;
      $("dersCard").innerHTML = `<div class="form">
        <button type="button" class="back" data-act="cancel">‹ Vazgeç</button>
        <div class="meta">${d.id ? "Dersi düzenle" : d.status === "gecti" ? "Geçmiş ders ekle" : "Yeni ders"}</div>
        <label>Ders adı</label><input data-f="name" value="${esc(d.name)}" placeholder="ör. Rechnernetze" autocomplete="off">
        <div class="row2">
          <div><label>Kısa ad (opsiyonel)</label><input data-f="short" value="${esc(d.short)}" placeholder="ör. RN" maxlength="12" autocomplete="off"></div>
          <div><label>ECTS</label><input data-f="ects" inputmode="decimal" value="${esc(d.ects)}" placeholder="ör. 6"></div>
        </div>
        <label>Renk</label>
        <div class="colors">${COLORS.map((c) => `<button type="button" data-act="color" data-color="${c}" style="background:${c}" aria-pressed="${d.color === c}" aria-label="Renk"></button>`).join("")}</div>
        <div class="row2">
          <div><label>Dönem</label><input data-f="semester" value="${esc(d.semester)}" placeholder="ör. WiSe 26/27" autocomplete="off"></div>
          <div><label>Durum</label><select data-f="status">${opt("aktif", "Devam ediyor", d.status)}${opt("gecti", "Geçti", d.status)}${opt("kaldi", "Kaldı", d.status)}</select></div>
        </div>
        <div data-show="gecti"${d.status === "gecti" ? "" : " hidden"}><label>Not (boş bırakırsan notsuz / bestanden)</label><input data-f="grade" inputmode="decimal" value="${esc(d.grade)}" placeholder="ör. 1,7"></div>
        <div data-show="aktif"${d.status === "aktif" ? "" : " hidden"}>
          <label>Ders saatleri</label>
          ${d.slots.map((s, i) => `<div class="slot-edit">
              <div class="r">
                <select data-s="weekday" data-i="${i}" aria-label="Gün">${WDS.slice(1).map((w, k) => opt(k + 1, w, s.weekday)).join("")}</select>
                <input type="time" data-s="start_time" data-i="${i}" value="${esc(s.start_time)}" aria-label="Başlangıç">
                <input type="time" data-s="end_time" data-i="${i}" value="${esc(s.end_time)}" aria-label="Bitiş">
              </div>
              <div class="r2">
                <select data-s="kind" data-i="${i}" aria-label="Tür">${KINDS.map((k) => opt(k, k, s.kind)).join("")}</select>
                <input data-s="room" data-i="${i}" value="${esc(s.room)}" placeholder="Salon" autocomplete="off" aria-label="Salon">
                <button type="button" class="btn-ghost danger" data-act="del-slot" data-i="${i}">Sil</button>
              </div>
            </div>`).join("")}
          <button type="button" class="btn-ghost" data-act="add-slot" style="width:100%;margin-top:8px">+ Saat ekle</button>
        </div>
        <div class="gym-actions">
          <button class="btn" type="button" data-act="save-course">Kaydet</button>
          <button class="btn-ghost" type="button" data-act="cancel">Vazgeç</button>
        </div>
        ${d.id ? `<button class="btn-ghost danger" type="button" data-act="del-course" style="width:100%">${ders.sure === "course" ? "Emin misin? Görevleri ve sınavları da silinir" : "Bu dersi sil"}</button>` : ""}
        <p class="error" id="dersErr"></p>
      </div>`;
      $("dersCard").querySelector('[data-f="status"]').addEventListener("change", (e) => {
        for (const el of $("dersCard").querySelectorAll("[data-show]")) el.hidden = el.dataset.show !== e.target.value;
      });
    }

    // Formdaki değerleri taslağa al (yeniden çizmeden önce, yazılanlar kaybolmasın)
    function syncDraft() {
      const d = ders.view?.draft;
      if (!d) return;
      $("dersCard").querySelectorAll("[data-f]").forEach((el) => { d[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value; });
      $("dersCard").querySelectorAll("[data-s]").forEach((el) => { d.slots[+el.dataset.i][el.dataset.s] = el.dataset.s === "weekday" ? +el.value : el.value; });
    }

    async function saveCourse() {
      if (ders.busy) return;
      syncDraft();
      const d = ders.view.draft, name = d.name.trim();
      if (!name) return dersErr("Ders adı boş olamaz.");
      const ects = num(d.ects), grade = d.status === "gecti" ? num(d.grade) : null;
      if (String(d.ects).trim() && ects == null) return dersErr("ECTS bir sayı olmalı.");
      if (String(d.grade).trim() && d.status === "gecti" && (grade == null || grade < 1 || grade > 5)) return dersErr("Not 1,0 ile 5,0 arasında olmalı.");
      const row = { name, short: d.short.trim() || null, color: d.color, ects, semester: d.semester.trim() || null, status: d.status, grade };
      ders.busy = true;
      try {
        let id = d.id;
        if (id) {
          const { error } = await sb.from("courses").update(row).eq("id", id);
          if (error) throw error;
        } else {
          const { data, error } = await sb.from("courses").insert({ ...row, position: ders.courses.length }).select("id").single();
          if (error) throw error;
          id = data.id;
        }
        const slots = d.slots.filter((s) => s.start_time).map((s) => ({
          ...(s.id ? { id: s.id } : {}), course_id: id, weekday: +s.weekday, start_time: s.start_time,
          end_time: s.end_time || null, kind: s.kind || null, room: (s.room || "").trim() || null,
        }));
        const keep = slots.filter((s) => s.id).map((s) => s.id);
        const removed = ders.slots.filter((s) => s.course_id === id && !keep.includes(s.id)).map((s) => s.id);
        if (removed.length) { const { error } = await sb.from("course_slots").delete().in("id", removed); if (error) throw error; }
        const existing = slots.filter((s) => s.id), fresh = slots.filter((s) => !s.id);
        if (existing.length) { const { error } = await sb.from("course_slots").upsert(existing); if (error) throw error; }
        if (fresh.length) { const { error } = await sb.from("course_slots").insert(fresh); if (error) throw error; }
        await fetchDers();
        ders.view = d.status === "aktif" || ders.view.back?.type === "course" ? { type: "course", id } : null;
        renderDers();
        window.scrollTo(0, 0);
      } catch (err) {
        dersErr("Kaydedilemedi: " + (err.message || err));
      } finally {
        ders.busy = false;
      }
    }

    async function deleteCourse() {
      const d = ders.view.draft;
      if (ders.sure !== "course") { syncDraft(); ders.sure = "course"; renderCourseEdit(); return; }
      ders.sure = null;
      const { error } = await sb.from("courses").delete().eq("id", d.id);
      if (error) return dersErr("Silinemedi: " + error.message);
      ders.view = null;
      await fetchDers();
      renderDers();
    }

    // --- Sınavlar ---
    function renderExams() {
      const now = Date.now();
      const list = [...ders.exams].sort((a, b) => new Date(a.exam_at) - new Date(b.exam_at));
      const up = list.filter((e) => new Date(e.exam_at).getTime() > now - 3 * 3600000);
      const past = list.filter((e) => !up.includes(e)).reverse();
      const row = (e, isPast) => {
        const c = courseOf(e.course_id), n = dayDiff(e.exam_at);
        let reg = "";
        if (!isPast && e.registered) reg = '<div class="ok">✓ Sınava kayıtlısın</div>';
        else if (!isPast && e.register_by) {
          const rn = dayDiff(dateOnly(e.register_by));
          reg = `<div class="warn">${rn < 0 ? "⚠️ Kayıt süresi geçti" : `⚠️ Kayıt son gün: ${fmtDate(dateOnly(e.register_by), false)} (${relDay(dateOnly(e.register_by))})`}
            <button type="button" class="mini-btn" data-act="reg-exam" data-id="${e.id}">Kayıt oldum</button></div>`;
        }
        return `<div class="exam${isPast ? " past" : ""}" data-act="edit-exam" data-id="${e.id}">
            <div class="exam-top">${dot(c)}<span class="nm">${esc(c?.name || "?")}</span><span class="cd">${isPast ? "" : n <= 0 ? "Bugün" : n === 1 ? "Yarın" : `${n} gün`}</span></div>
            <div class="sub">${fmtDate(e.exam_at)}${e.room ? " · " + esc(e.room) : ""}${e.note ? " · " + esc(e.note) : ""}</div>
            ${reg}
          </div>`;
      };
      $("dersCard").innerHTML = (up.length ? up.map((e) => row(e, false)).join("") : '<div class="empty" style="padding:24px 8px">Yaklaşan sınav yok.</div>')
        + (past.length ? `<div class="sub-h"><span>GEÇMİŞ SINAVLAR</span></div>${past.map((e) => row(e, true)).join("")}` : "")
        + `<button class="btn" type="button" data-act="new-exam" style="width:100%;margin-top:14px">+ Sınav ekle</button>
           <p class="est" style="margin:10px 0 0">Düzenlemek için sınava dokun.</p><p class="error" id="dersErr"></p>`;
    }

    function openExamEditor(e) {
      const firstActive = ders.courses.find((c) => c.status === "aktif") || ders.courses[0];
      const [date, time] = isoParts(e?.exam_at);
      ders.view = {
        type: "exam", back: ders.view,
        draft: e
          ? { id: e.id, course_id: e.course_id, date, time, room: e.room || "", register_by: e.register_by || "", registered: e.registered, note: e.note || "" }
          : { id: null, course_id: firstActive?.id ?? "", date: "", time: "09:00", room: "", register_by: "", registered: false, note: "" },
      };
      ders.sure = null;
      renderDers();
      window.scrollTo(0, 0);
    }

    function renderExamEdit() {
      const d = ders.view.draft;
      if (!ders.courses.length) {
        $("dersCard").innerHTML = `<button type="button" class="back" data-act="cancel">‹ Geri</button>
          <div class="empty">Sınav eklemek için önce bir ders ekle.</div>
          <button class="btn" type="button" data-act="new-course" style="width:100%">+ Ders ekle</button>`;
        return;
      }
      const sorted = [...ders.courses].sort((a, b) => (a.status === "aktif" ? 0 : 1) - (b.status === "aktif" ? 0 : 1));
      $("dersCard").innerHTML = `<div class="form">
        <button type="button" class="back" data-act="cancel">‹ Vazgeç</button>
        <div class="meta">${d.id ? "Sınavı düzenle" : "Yeni sınav"}</div>
        <label>Ders</label><select data-f="course_id">${sorted.map((c) => opt(c.id, c.name, d.course_id)).join("")}</select>
        <div class="row2">
          <div><label>Tarih</label><input type="date" data-f="date" value="${esc(d.date)}"></div>
          <div><label>Saat</label><input type="time" data-f="time" value="${esc(d.time)}"></div>
        </div>
        <label>Salon (opsiyonel)</label><input data-f="room" value="${esc(d.room)}" placeholder="ör. Audimax" autocomplete="off">
        <label>Kayıt (Anmeldung) son günü (opsiyonel)</label><input type="date" data-f="register_by" value="${esc(d.register_by)}">
        <label class="check"><input type="checkbox" data-f="registered"${d.registered ? " checked" : ""}> Sınava kayıt oldum</label>
        <label>Not (opsiyonel)</label><input data-f="note" value="${esc(d.note)}" placeholder="ör. Hilfsmittel: 1 A4 sayfa" autocomplete="off">
        <div class="gym-actions">
          <button class="btn" type="button" data-act="save-exam">Kaydet</button>
          <button class="btn-ghost" type="button" data-act="cancel">Vazgeç</button>
        </div>
        ${d.id ? `<button class="btn-ghost danger" type="button" data-act="del-exam" style="width:100%">${ders.sure === "exam" ? "Emin misin? Silmek için tekrar dokun" : "Bu sınavı sil"}</button>` : ""}
        <p class="error" id="dersErr"></p>
      </div>`;
    }

    async function saveExam() {
      if (ders.busy) return;
      syncDraft();
      const d = ders.view.draft;
      if (!d.course_id) return dersErr("Bir ders seç.");
      if (!d.date) return dersErr("Sınav tarihini gir.");
      const row = { course_id: +d.course_id, exam_at: localIso(d.date, d.time || "09:00"), room: d.room.trim() || null, register_by: d.register_by || null, registered: !!d.registered, note: d.note.trim() || null };
      ders.busy = true;
      const { error } = d.id ? await sb.from("exams").update(row).eq("id", d.id) : await sb.from("exams").insert(row);
      ders.busy = false;
      if (error) return dersErr("Kaydedilemedi: " + error.message);
      ders.view = ders.view.back || null;
      await fetchDers();
      renderDers();
    }

    async function deleteExam() {
      if (ders.sure !== "exam") { syncDraft(); ders.sure = "exam"; renderExamEdit(); return; }
      ders.sure = null;
      const { error } = await sb.from("exams").delete().eq("id", ders.view.draft.id);
      if (error) return dersErr("Silinemedi: " + error.message);
      ders.view = ders.view.back || null;
      await fetchDers();
      renderDers();
    }

    async function markRegistered(id) {
      const e = ders.exams.find((x) => x.id === id);
      if (!e) return;
      e.registered = true;
      renderDers();
      const { error } = await sb.from("exams").update({ registered: true }).eq("id", id);
      if (error) { e.registered = false; renderDers(); dersErr("Kaydedilemedi: " + error.message); }
    }

    // --- Notlar ve ECTS ---
    function renderGrades() {
      const C = ders.courses;
      const passed = C.filter((c) => c.status === "gecti");
      const graded = passed.filter((c) => c.grade != null && +c.ects > 0);
      const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
      const ectsDone = sum(passed, (c) => +c.ects || 0), ectsNow = sum(C.filter((c) => c.status === "aktif"), (c) => +c.ects || 0);
      const w = sum(graded, (c) => +c.ects);
      const avg = w ? sum(graded, (c) => c.grade * c.ects) / w : null;
      // Not ortalaması Almanya'da genelde virgülden sonra tek haneye yuvarlanmadan kesilir
      const avgShow = avg == null ? "–" : (Math.floor(avg * 10 + 1e-9) / 10).toFixed(1).replace(".", ",");
      const groups = new Map();
      for (const c of [...C].sort((a, b) => semKey(b.semester) - semKey(a.semester) || a.position - b.position)) {
        const k = c.semester || "Dönem belirtilmemiş";
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(c);
      }
      const right = (c) => c.status === "aktif" ? '<span class="gr muted">devam ediyor</span>'
        : c.status === "kaldi" ? '<span class="gr bad">kaldı</span>'
        : c.grade != null ? `<span class="gr">${fmtGrade(c.grade)}</span>` : '<span class="gr muted">bestanden</span>';
      $("dersCard").innerHTML = `
        <div class="stats">
          <div class="stat"><div class="k">Toplam ECTS</div><div class="v">${fmtNum(ectsDone)}</div><div class="s">${ectsNow ? `+${fmtNum(ectsNow)} devam eden` : `${passed.length} ders geçildi`}</div></div>
          <div class="stat"><div class="k">Not ortalaması</div><div class="v">${avgShow}</div><div class="s">${avg == null ? "notlu ders yok" : `${graded.length} notlu ders · ${avg.toFixed(2).replace(".", ",")}`}</div></div>
        </div>
        ${C.length ? [...groups].map(([sem, list]) => `<div class="sub-h"><span>${esc(sem)}</span><span>${((e) => (e ? fmtNum(e) + " ECTS" : ""))(sum(list.filter((c) => c.status === "gecti"), (c) => +c.ects || 0))}</span></div>
          ${list.map((c) => `<button type="button" class="crs" data-act="edit-course" data-id="${c.id}">
              <div class="crs-top">${dot(c)}<span class="nm">${esc(c.name)}</span>${right(c)}</div>
              <div class="sub">${c.ects ? fmtNum(c.ects) + " ECTS" : "ECTS girilmemiş"}</div>
            </button>`).join("")}`).join("")
          : '<div class="empty" style="padding:24px 8px">Henüz ders yok.<br><small>Geçtiğin dersleri notlarıyla ekle; ECTS toplamın ve ortalaman otomatik hesaplanır.</small></div>'}
        <button class="btn" type="button" data-act="new-course" data-status="gecti" style="width:100%;margin-top:14px">+ Geçmiş ders ekle</button>
        <p class="est" style="margin:10px 0 0">Bir ders bitince derse dokun, durumunu “Geçti” yapıp notunu gir.</p>
        <p class="error" id="dersErr"></p>`;
    }

    // Tek tıklama dinleyicisi: kart içindeki tüm butonlar data-act ile buraya gelir
    $("dersCard").addEventListener("click", (ev) => {
      const el = ev.target.closest("[data-act]");
      if (!el || !$("dersCard").contains(el)) return;
      const act = el.dataset.act, id = +el.dataset.id;
      if (!["del-course", "del-exam"].includes(act) && ders.sure) ders.sure = null;
      switch (act) {
        case "open-course": ders.view = { type: "course", id }; renderDers(); window.scrollTo(0, 0); break;
        case "back": ders.view = null; renderDers(); break;
        case "new-course": openCourseEditor(null, el.dataset.status); break;
        case "edit-course": openCourseEditor(courseOf(id)); break;
        case "color": syncDraft(); ders.view.draft.color = el.dataset.color; renderCourseEdit(); break;
        case "add-slot": {
          syncDraft();
          const last = ders.view.draft.slots.at(-1);
          ders.view.draft.slots.push({ weekday: last?.weekday || 1, start_time: "", end_time: "", kind: "Übung", room: last?.room || "" });
          renderCourseEdit();
          break;
        }
        case "del-slot": syncDraft(); ders.view.draft.slots.splice(+el.dataset.i, 1); renderCourseEdit(); break;
        case "cancel": ders.view = ders.view?.back || null; renderDers(); break;
        case "save-course": saveCourse(); break;
        case "del-course": deleteCourse(); break;
        case "add-task": addTask(ders.view.id); break;
        case "toggle-task": toggleTask(id); break;
        case "del-task": delTask(id); break;
        case "new-exam": openExamEditor(null); break;
        case "edit-exam": openExamEditor(ders.exams.find((e) => e.id === id)); break;
        case "save-exam": saveExam(); break;
        case "del-exam": deleteExam(); break;
        case "reg-exam": markRegistered(id); break;
      }
    });
    document.addEventListener("visibilitychange", () => { if (!document.hidden && currentTab === "ders" && loggedIn) loadDers(); });

    // ---------- Gym oyunlaştırma: haftalık seri, XP/seviye, rekorlar, rozetler ----------
    // Her şey mevcut antrenman kayıtlarından hesaplanır; sadece haftalık hedef ayrıca saklanır.
    const LEVEL_TITLES = [[1, "Çaylak"], [3, "Düzenli"], [5, "Azimli"], [8, "Demir"], [12, "Çelik"], [16, "Titan"], [20, "Efsane"]];
    const gx = { goalOpen: false, badgesOpen: false };
    const gxDay = (iso) => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Berlin" }).format(new Date(iso));
    const shiftDay = (ds, n) => { const d = new Date(ds + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
    const weekOf = (iso) => { const ds = gxDay(iso), wd = (new Date(ds + "T12:00:00Z").getUTCDay() + 6) % 7; return shiftDay(ds, -wd); };   // haftanın pazartesisi
    const berlinHour = (iso) => +new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", hour12: false, timeZone: "Europe/Berlin" }).slice(0, 2);

    function levelOf(xp) {
      let L = 1, need = 300, rest = xp;
      while (rest >= need) { rest -= need; L++; need = 300 + 100 * (L - 1); }
      return { L, into: rest, need, title: [...LEVEL_TITLES].reverse().find(([l]) => L >= l)[1] };
    }

    function gymStats() {
      const logsBy = new Map();
      for (const l of gym.logs) { if (!logsBy.has(l.session_id)) logsBy.set(l.session_id, []); logsBy.get(l.session_id).push(l); }
      // Sayılan antrenman: tamamlanan ya da en az bir seti işaretlenen ("Tamamla"ya basmayı unutsan da sayılır)
      const sessions = gym.sessions.filter((s) => s.completed_at || logsBy.has(s.id)).sort((a, b) => new Date(a.started_at) - new Date(b.started_at));
      const best = new Map(), prIds = new Set(), perSession = new Map();
      let xp = 0, prCount = 0, totalVol = 0, maxVol = 0, early = false, late = false, fullSession = false;
      for (const s of sessions) {
        const ls = logsBy.get(s.id) || [];
        const sessBest = new Map();
        let vol = 0;
        for (const l of ls) {
          vol += (+l.weight_kg || 0) * (l.reps || 0);
          if (l.weight_kg == null) continue;
          const k = norm(l.exercise_name), prev = best.get(k);
          if (prev != null && +l.weight_kg > prev) prIds.add(l.id);   // önceki antrenmanlardaki en yüksek ağırlığı geçti
          sessBest.set(k, Math.max(sessBest.get(k) ?? -1, +l.weight_kg));
        }
        for (const [k, w] of sessBest) best.set(k, Math.max(best.get(k) ?? -1, w));
        const prs = new Set(ls.filter((l) => prIds.has(l.id)).map((l) => norm(l.exercise_name))).size;
        const gained = 50 + ls.length * 5 + prs * 25;
        perSession.set(s.id, { xp: gained, prs, vol, sets: ls.length });
        xp += gained; prCount += prs; totalVol += vol; maxVol = Math.max(maxVol, vol);
        const h = berlinHour(s.started_at);
        if (h < 8) early = true;
        if (h >= 21) late = true;
        const total = gym.exercises.filter((x) => x.day_id === s.day_id).reduce((a, x) => a + (x.sets ?? 1), 0);
        if (total && ls.length >= total) fullSession = true;
      }
      // Haftalık seri: hedefi tutturduğun ardışık haftalar (antrenman yaptığın farklı gün sayısı)
      const goal = gym.goal || 3;
      const weekDays = new Map(), weekProgram = new Map();
      for (const s of sessions) {
        const wk = weekOf(s.started_at);
        if (!weekDays.has(wk)) { weekDays.set(wk, new Set()); weekProgram.set(wk, new Set()); }
        weekDays.get(wk).add(gxDay(s.started_at));
        weekProgram.get(wk).add(s.day_id);
      }
      const cnt = (wk) => weekDays.get(wk)?.size || 0;
      const thisWk = weekOf(new Date().toISOString());
      let streak = 0, wk = cnt(thisWk) >= goal ? thisWk : shiftDay(thisWk, -7);
      while (cnt(wk) >= goal) { streak++; wk = shiftDay(wk, -7); }
      let bestStreak = 0, run = 0;
      if (sessions.length) {
        for (let w = weekOf(sessions[0].started_at); w <= thisWk; w = shiftDay(w, 7)) {
          run = cnt(w) >= goal ? run + 1 : 0;
          bestStreak = Math.max(bestStreak, run);
        }
      }
      const ids = gym.days.map((d) => d.id);
      const fullWeek = ids.length >= 2 && [...weekProgram.values()].some((set) => ids.every((id) => set.has(id)));
      const today = gxDay(new Date().toISOString());
      const week = Array.from({ length: 7 }, (_, i) => { const ds = shiftDay(thisWk, i); return { ds, on: weekDays.get(thisWk)?.has(ds) || false, today: ds === today, future: ds > today }; });
      return { n: sessions.length, xp, lvl: levelOf(xp), prIds, prCount, perSession, totalVol, maxVol, early, late, fullSession, fullWeek, goal, streak, bestStreak, thisCount: cnt(thisWk), week };
    }

    function todayWeather(w) {
      const c = w.current, d = w.daily, h = w.hourly, today = d.time[0];
      const rainy = [], feels = [];
      h.time.forEach((t, i) => {
        if (t.slice(0, 10) !== today) return;
        const hr = +t.slice(11, 13);
        if (hr >= 8 && hr <= 22 && (h.precipitation_probability[i] ?? 0) >= 50) rainy.push(hr);
        if (hr >= 7 && hr <= 21) feels.push(h.apparent_temperature?.[i] ?? h.temperature_2m[i]);
      });
      const pad = (n) => String(n).padStart(2, "0");
      const rain = rainy.length
        ? `☂️ ${rainy[rainy.length - 1] + 1 - rainy[0] >= 12 ? "Gün boyu" : `${pad(rainy[0])}:00–${pad(rainy[rainy.length - 1] + 1)}:00 arası`} yağış, şemsiyeni al`
        : "Yağış beklenmiyor";
      const fmin = feels.length ? Math.min(...feels) : d.temperature_2m_min[0];
      const wear = fmin <= 0 ? "🧣 Kalın mont, bere, eldiven" : fmin <= 8 ? "🧥 Mont giy" : fmin <= 14 ? "🧥 Ceket yeterli" : fmin <= 20 ? "👕 Hafif ceket" : "😎 Tişört havası";
      setCard("tWx", `<div class="tc-big">${icon(c.weather_code, c.is_day)} ${r0(c.temperature_2m)}° · ${wmo(c.weather_code)[0]}</div>
        <div class="tc-line muted">Bugün ${r0(d.temperature_2m_min[0])}° / ${r0(d.temperature_2m_max[0])}° · hissedilen ${r0(c.apparent_temperature)}°</div>

    function todayRoute() {

    function todayTransit(t, from, to) {
      const P = TRANSIT.places, list = t.res.list.slice(0, 2);
      const head = `${P[from].icon} → ${P[to].icon} ${P[to].label}`;
      if (!list.length) { setCard("tTransit", `<div class="tc-big">${head}</div><div class="tc-line muted">Yakında uygun bağlantı yok.</div>`); return; }
      const walk = P[from].walk || 0;
      const rows = list.map(({ steps, arr, est }) => {
        const d1 = steps[0].d, leave = depT(d1) - walk * MIN, inMin = Math.round((leave - t.now) / MIN);
        const when = inMin < 0 ? (walk ? "yürüyerek yetişilmez" : "şimdi") : inMin === 0 ? (walk ? "hemen çık" : "şimdi") : walk ? `${inMin} dk sonra çık` : `${inMin} dk sonra`;
        const delay = steps.some((s) => (s.d.delayInMinutes || 0) > 0) ? ` <span class="late">+${Math.max(...steps.map((s) => s.d.delayInMinutes || 0))} dk</span>` : "";
        return `<li>${steps.map((s) => `<span class="line ${esc(s.d.label)}">${esc(s.d.label)}</span>`).join(" ")} ${hhmm(depT(d1))} → ${est ? "~" : ""}${hhmm(arr)} · <b>${when}</b>${delay}</li>`;
      }).join("");
      const now = Date.now();
      const issues = (t.msgs || []).filter((m) => (m.lines || []).some((l) => t.lines.includes(l.label)) &&
        (m.incidentDurations?.length ? m.incidentDurations : [{ from: m.validFrom, to: m.validTo }]).some((x) => (x.from ?? 0) <= now && (x.to ?? 9e15) >= now));
      setCard("tTransit", `<div class="tc-big">${head}</div><ul class="tc-list">${rows}</ul>
        ${issues.length ? `<div class="tc-line warn">⚠️ ${esc(issues[0].title)}${issues.length > 1 ? ` (+${issues.length - 1})` : ""}</div>` : `<div class="tc-line muted">✅ ${t.lines.join("/")} normal</div>`}`);
    }

      todayMail();
      const failed = (id, what) => setCard(id, `<div class="tc-line muted">${what} alınamadı. Dokunup sekmeyi aç.</div>`);
      fetchWeather().then(todayWeather).catch(() => failed("tWx", "Hava durumu"));
      fetchDers().then(todayDers).catch(() => failed("tDers", "Ders bilgileri"));
      fetchList("todo").then(() => todayList("todo")).catch(() => failed("tTodo", "To-do listesi"));
      fetchList("market").then(() => todayList("market")).catch(() => failed("tGrocery", "Market listesi"));
      fetchGym().then(todayGym).catch(() => failed("tGym", "Gym programı")).finally(() => {
        const [from, to] = todayRoute();
        fetchTransit(from, to).then((t) => todayTransit(t, from, to)).catch(() => failed("tTransit", "Ulaşım verisi"));
      });
      // Bugün ekranı açıkken her dakika yenile (kalkış saatleri için)
      todayTimer = setTimeout(() => { if (currentTab === "bugun" && !document.hidden) loadToday(); }, 60 * 1000);
    }

    for (const card of document.querySelectorAll(".tcard")) {
      card.addEventListener("click", () => {
        if (card.id === "tTransit") { [tFrom, tTo] = todayRoute(); }
        if (card.id === "tMail" && digests[0]) select(digests[0].digest_date);
        if (card.id === "tDers") ders.view = null;
        showTab(card.dataset.goto);
        window.scrollTo(0, 0);
      });
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden && currentTab === "bugun" && loggedIn) loadToday(); });

    // ---------- Gmail'i aç ----------
    // iPhone'da Gmail uygulamasını açar; uygulama yüklü değilse web'deki Gmail'e geçer.
    // Diğer cihazlarda mail.google.com açılır (Android bunu Gmail uygulamasında açar).
    $("openMail").addEventListener("click", (e) => {
      if (!isIOS) return; // normal link: mail.google.com
      e.preventDefault();
      let left = false;
      const onHide = () => { if (document.hidden) left = true; };
      document.addEventListener("visibilitychange", onHide);
      window.location.href = "googlegmail://";
      setTimeout(() => {
        document.removeEventListener("visibilitychange", onHide);
        if (!left && !document.hidden) window.location.href = "https://mail.google.com/mail/";
      }, 1500);
    });

    // ---------- Başlat ----------
    // Uygulama "Bugün" ile açılır; bildirimden (?d=...) gelindiyse mailler
    const qs = new URLSearchParams(location.search);
    const TABS = ["bugun", "mail", "hava", "ulasim", "ders", "gym", "market", "todo"];
    let startTab = TABS.includes(qs.get("tab")) ? qs.get("tab") : "bugun";
    if (qs.get("d")) startTab = "mail";
    showTab(startTab);

    sb.auth.getSession().then(({ data }) => (data.session ? showApp() : showLogin()));
  })();
  </script>
</body>
</html>
